<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>المدرسون - منصة THE BEST</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --subtext: #8e8e93;
      --gold: #d4a017;
      --shadow: 0 4px 20px rgba(0,0,0,0.04);
      --topbar-bg: rgba(255,255,255,0.92);
      --separator: rgba(60,60,67,0.08);
    }
    body.light-mode {
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --subtext: #8e8e93;
      --topbar-bg: rgba(255,255,255,0.92);
    }
    body.dark-mode {
      --bg: #0e0e0e;
      --card-bg: #1c1c1e;
      --text: #f5f5f7;
      --subtext: #98989e;
      --topbar-bg: rgba(30,30,30,0.92);
      --shadow: 0 4px 20px rgba(0,0,0,0.3);
      --separator: rgba(255,255,255,0.08);
    }
    body {
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 0;
      margin: 0;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .app-container {
      max-width: 430px;
      width: 100%;
      background: var(--bg);
      min-height: 100vh;
      padding: 0 20px 100px;
      position: relative;
      transition: background 0.3s;
    }
    /* ===== شريط الحالة ===== */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 6px 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      opacity: 0.8;
      letter-spacing: 0.2px;
      min-height: 40px;
    }
    .status-left, .status-right { display: flex; align-items: center; gap: 8px; }
    .status-battery { display: flex; align-items: center; gap: 4px; }
    .battery-level { font-size: 14px; font-weight: 700; }
    /* ===== شريط التنقل ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 16px;
      border-bottom: 1px solid var(--separator);
      margin-bottom: 20px;
      background: var(--bg);
      transition: background 0.3s;
    }
    .topbar .back-btn {
      font-size: 24px;
      cursor: pointer;
      background: rgba(0,0,0,0.04);
      border-radius: 50%;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
      border: none;
      color: var(--text);
      font-weight: 600;
    }
    .topbar .back-btn:hover { background: rgba(0,0,0,0.08); }
    .topbar .brand {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #d4a017, #f5d742);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .topbar .actions {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .topbar .actions button, .topbar .actions a {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 22px;
      color: var(--text);
      opacity: 0.8;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0,0,0,0.04);
      text-decoration: none;
    }
    .topbar .actions button:hover, .topbar .actions a:hover {
      opacity: 1;
      background: rgba(0,0,0,0.08);
    }
    .toggle-dark {
      width: 52px; height: 30px;
      background: #e9e9ed;
      border-radius: 30px;
      position: relative;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }
    .toggle-dark.active { background: #34c759; }
    .toggle-dark .thumb {
      width: 26px; height: 26px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 2px; left: 2px;
      transition: 0.3s cubic-bezier(0.3, 1.2, 0.4, 1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .toggle-dark.active .thumb { transform: translateX(22px); }
    /* ===== العنوان ===== */
    .page-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-title .highlight {
      background: var(--gold);
      color: white;
      font-size: 16px;
      padding: 4px 14px;
      border-radius: 40px;
      font-weight: 600;
    }
    /* ===== قائمة المدرسين (نمط iOS) ===== */
    .teachers-list {
      display: flex;
      flex-direction: column;
      gap: 0;
      background: var(--card-bg);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--separator);
    }
    .teacher-item {
      display: flex;
      align-items: center;
      padding: 16px 18px;
      background: var(--card-bg);
      border-bottom: 1px solid var(--separator);
      cursor: pointer;
      transition: background 0.15s ease;
      gap: 14px;
    }
    .teacher-item:last-child { border-bottom: none; }
    .teacher-item:active {
      background: var(--gold);
      color: white;
    }
    .teacher-item:active .teacher-sub { color: rgba(255,255,255,0.8); }
    .teacher-item:active .arrow { color: white; }

    .teacher-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #f0f0f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
      transition: 0.2s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }
    .dark-mode .teacher-avatar { background: #2c2c2e; }

    .teacher-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .teacher-name {
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
      transition: color 0.2s;
    }
    .teacher-sub {
      font-size: 14px;
      font-weight: 400;
      color: var(--subtext);
      transition: color 0.2s;
    }
    .arrow {
      font-size: 20px;
      color: var(--subtext);
      opacity: 0.6;
      font-weight: 300;
      transition: 0.2s;
    }
    /* ===== حالة التحميل والفارغ ===== */
    .teacher-item.loading {
      justify-content: center;
      gap: 14px;
      background: transparent;
      box-shadow: none;
      border: none;
      font-weight: 400;
      color: var(--text);
      opacity: 0.6;
      cursor: default;
      padding: 40px 0;
      pointer-events: none;
    }
    .teacher-item.loading::after {
      content: "";
      width: 28px;
      height: 28px;
      border: 3px solid var(--gold);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .teacher-item.loading .teacher-avatar { display: none; }
    .teacher-item.empty {
      justify-content: center;
      background: transparent;
      box-shadow: none;
      border: none;
      cursor: default;
      padding: 30px 0;
      color: var(--subtext);
      font-weight: 500;
    }
    .teacher-item.empty:active { background: transparent; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* ===== زر البروفايل ===== */
    .profile-float {
      position: fixed;
      bottom: 30px;
      left: 30px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 2px solid var(--gold);
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.3s;
      z-index: 999;
      text-decoration: none;
      color: var(--text);
      font-size: 28px;
    }
    .profile-float:hover { transform: scale(1.05); background: var(--gold); color: white; border-color: white; }
    /* ===== Toast ===== */
    .custom-toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      color: white;
      padding: 14px 28px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      z-index: 9999;
      animation: toastIn 0.4s ease, toastOut 0.4s ease 2.8s forwards;
      max-width: 85%;
      white-space: nowrap;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(30px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(30px); } }
    @media (max-width: 480px) {
      .app-container { padding: 0 16px 80px; }
      .page-title { font-size: 24px; }
      .teacher-item { padding: 14px 16px; }
      .teacher-avatar { width: 40px; height: 40px; font-size: 20px; }
      .profile-float { width: 50px; height: 50px; bottom: 20px; left: 20px; font-size: 22px; }
      .status-bar { font-size: 12px; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- ===== شريط الحالة ===== -->
  <div class="status-bar">
    <div class="status-left"><span id="statusTime">00:00</span></div>
    <div class="status-right">
      <span id="statusNetwork">📶</span>
      <span class="status-battery">
        <span id="batteryIcon">🔋</span>
        <span class="battery-level" id="batteryLevel">--%</span>
      </span>
    </div>
  </div>

  <!-- ===== شريط التنقل ===== -->
  <div class="topbar">
    <button class="back-btn" id="backBtn">←</button>
    <div class="brand">THE BEST</div>
    <div class="actions">
      <div class="toggle-dark" id="darkToggle"><div class="thumb"></div></div>
      <a href="https://wa.me/" target="_blank">💬</a>
      <button id="shareBtn">📤</button>
      <button id="notifyBtn">🔔</button>
    </div>
  </div>

  <!-- ===== العنوان ===== -->
  <div class="page-title" id="pageTitle">
    👨‍🏫 المدرسون <span class="highlight">اختر</span>
  </div>

  <!-- ===== قائمة المدرسين ===== -->
  <div class="teachers-list" id="teachersList">
    <div class="teacher-item loading">جاري التحميل...</div>
  </div>

  <!-- ===== زر البروفايل ===== -->
  <a href="profile.html" class="profile-float">👤</a>
</div>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
    "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
  }
}
</script>
<script type="module">
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, get, child } from 'firebase/database';

// ===== Firebase Config =====
const firebaseConfig = {
  apiKey: "AIzaSyB0p0us6BuzD2ngzjhRnmUIhlOcBeRp0vQ",
  authDomain: "tok-tak-d6e17.firebaseapp.com",
  databaseURL: "https://tok-tak-d6e17-default-rtdb.firebaseio.com",
  projectId: "tok-tak-d6e17",
  storageBucket: "tok-tak-d6e17.appspot.com",
  messagingSenderId: "547062578826",
  appId: "1:547062578826:web:aa285cf798341be07cb773",
  measurementId: "G-7EMKEQKPVV"
};
const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

// ===== عناصر DOM =====
const teachersList = document.getElementById('teachersList');
const pageTitle = document.getElementById('pageTitle');
const darkToggle = document.getElementById('darkToggle');
const shareBtn = document.getElementById('shareBtn');
const notifyBtn = document.getElementById('notifyBtn');
const backBtn = document.getElementById('backBtn');

const statusTime = document.getElementById('statusTime');
const statusNetwork = document.getElementById('statusNetwork');
const batteryIcon = document.getElementById('batteryIcon');
const batteryLevel = document.getElementById('batteryLevel');

// ===== معاملات الرابط =====
const urlParams = new URLSearchParams(window.location.search);
const year = urlParams.get('year');
const subject = urlParams.get('subject');
if (subject && year) pageTitle.textContent = `👨‍🏫 مدرسون ${subject}`;

// ===== العودة =====
backBtn.addEventListener('click', () => window.location.href = `subjects.html?year=${encodeURIComponent(year || '')}`);

// ===== الوقت =====
function updateTime() {
  const now = new Date();
  statusTime.textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
}
updateTime();
setInterval(updateTime, 1000);

// ===== الشبكة =====
function updateNetwork() {
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if (!conn) { statusNetwork.textContent = '📶'; return; }
  statusNetwork.textContent = '📶';
  statusNetwork.title = conn.effectiveType || 'شبكة';
}
updateNetwork();
if (navigator.connection) navigator.connection.addEventListener('change', updateNetwork);

// ===== البطارية =====
async function updateBattery() {
  try {
    if (!navigator.getBattery) { batteryLevel.textContent = '--%'; batteryIcon.textContent = '🔋'; return; }
    const battery = await navigator.getBattery();
    const level = Math.round(battery.level * 100);
    batteryLevel.textContent = `${level}%`;
    batteryIcon.textContent = battery.charging ? '⚡️' : '🔋';
    battery.addEventListener('levelchange', updateBattery);
    battery.addEventListener('chargingchange', updateBattery);
  } catch { batteryLevel.textContent = '--%'; batteryIcon.textContent = '🔋'; }
}
updateBattery();

// ===== Toast =====
function showToast(msg) {
  const existing = document.querySelector('.custom-toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'custom-toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ===== تحميل المدرسين (مع أيقونات عشوائية وتخصصات) =====
async function loadTeachers() {
  if (!year || !subject) {
    teachersList.innerHTML = `<div class="teacher-item empty">⚠️ لم يتم تحديد السنة أو المادة</div>`;
    return;
  }
  try {
    const dbRef = ref(database);
    const snapshot = await get(child(dbRef, `years/${year}/subjects/${subject}/teachers`));
    if (!snapshot.exists()) {
      teachersList.innerHTML = `<div class="teacher-item empty">⚠️ لا يوجد مدرسون لهذه المادة</div>`;
      return;
    }
    const data = snapshot.val();
    let teachers = [];
    if (Array.isArray(data)) {
      teachers = data.map(t => t.teacher_name || t.name || t).filter(Boolean);
    } else {
      teachers = Object.keys(data);
    }
    teachersList.innerHTML = '';
    if (teachers.length === 0) {
      teachersList.innerHTML = `<div class="teacher-item empty">⚠️ لا يوجد مدرسون</div>`;
      return;
    }

    // قائمة أيقونات عشوائية للمدرسين
    const avatars = ['👨‍🏫'];
    // قائمة تخصصات وهمية (أو نعرض السنة والمادة)
    const specialties = [`معلم ${subject}`, `خبير ${subject}`, `أستاذ ${subject}`, `مدرس ${subject}`];

    teachers.sort().forEach((t, index) => {
      const item = document.createElement('div');
      item.className = 'teacher-item';
      
      // اختيار أيقونة عشوائية بناءً على اسم المدرس (لضمان الثبات)
      const hash = t.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
      const avatar = avatars[hash % avatars.length];
      const specialty = specialties[hash % specialties.length];

      item.innerHTML = `
        <div class="teacher-avatar">${avatar}</div>
        <div class="teacher-info">
          <div class="teacher-name">${t}</div>
          <div class="teacher-sub">${specialty} • ${year}</div>
        </div>
        <span class="arrow">›</span>
      `;
      
      item.addEventListener('click', () => {
        window.location.href = `chapters.html?year=${encodeURIComponent(year)}&subject=${encodeURIComponent(subject)}&teacher=${encodeURIComponent(t)}`;
      });
      teachersList.appendChild(item);
    });
  } catch (err) {
    console.error(err);
    teachersList.innerHTML = `<div class="teacher-item empty" style="color:#ff3b30;">❌ فشل التحميل</div>`;
  }
}
loadTeachers();

// ===== تبديل الوضع =====
function toggleTheme() {
  const isDark = document.body.classList.contains('dark-mode');
  if (isDark) {
    document.body.classList.remove('dark-mode');
    document.body.classList.add('light-mode');
    darkToggle.classList.remove('active');
    localStorage.setItem('theme', 'light');
  } else {
    document.body.classList.remove('light-mode');
    document.body.classList.add('dark-mode');
    darkToggle.classList.add('active');
    localStorage.setItem('theme', 'dark');
  }
}
const savedTheme = localStorage.getItem('theme') || 'light';
if (savedTheme === 'dark') {
  document.body.classList.add('dark-mode');
  darkToggle.classList.add('active');
} else {
  document.body.classList.add('light-mode');
}
darkToggle.addEventListener('click', toggleTheme);

// ===== مشاركة =====
shareBtn.addEventListener('click', async () => {
  if (navigator.share) {
    try {
      await navigator.share({ title: 'منصة THE BEST', text: 'منصة تعليمية متكاملة', url: window.location.href });
    } catch { showToast('❌ تم إلغاء المشاركة'); }
  } else showToast('المشاركة غير مدعومة');
});

// ===== إشعارات =====
notifyBtn.addEventListener('click', () => showToast('🔔 الإشعارات ستُفعل قريباً!'));

// ===== تأثير إضافي: عند النقر على أي عنصر في القائمة =====
document.addEventListener('click', (e) => {
  const item = e.target.closest('.teacher-item');
  if (item && !item.classList.contains('loading') && !item.classList.contains('empty')) {
    // تأثير مؤقت للون الذهبي (يتم التعامل معه في CSS عبر :active)
    // لكننا نضيف كلاس إضافي لتأثير لحظي
    item.style.transition = 'background 0.1s';
    item.style.background = 'var(--gold)';
    item.style.color = 'white';
    const sub = item.querySelector('.teacher-sub');
    const arrow = item.querySelector('.arrow');
    if (sub) sub.style.color = 'rgba(255,255,255,0.8)';
    if (arrow) arrow.style.color = 'white';
    setTimeout(() => {
      item.style.background = '';
      item.style.color = '';
      if (sub) sub.style.color = '';
      if (arrow) arrow.style.color = '';
    }, 200);
  }
});
</script>
</body>
</html>
