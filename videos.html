<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>الفيديوهات - منصة THE BEST</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0a0a0a;
      --card-bg: #1a1a1a;
      --card-hover: #2a2a2a;
      --text: #f5f5f7;
      --subtext: #98989e;
      --gold: #d4a017;
      --gold-light: #f5d742;
      --shadow: 0 8px 40px rgba(0,0,0,0.5);
      --separator: rgba(255,255,255,0.06);
      --radius: 20px;
    }
    body.light-mode {
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --card-hover: #f0f0f5;
      --text: #1c1c1e;
      --subtext: #8e8e93;
      --shadow: 0 8px 40px rgba(0,0,0,0.08);
      --separator: rgba(60,60,67,0.08);
    }
    body {
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .app-container {
      max-width: 430px;
      width: 100%;
      background: var(--bg);
      min-height: 100vh;
      padding: 0 16px 100px;
      position: relative;
      transition: background 0.3s;
    }
    /* ===== شريط الحالة ===== */
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 2px 6px; font-size: 13px; font-weight: 600;
      color: var(--text); opacity: 0.7; min-height: 36px;
    }
    .status-left, .status-right { display: flex; align-items: center; gap: 8px; }
    .status-battery { display: flex; align-items: center; gap: 4px; }
    .battery-level { font-size: 13px; font-weight: 700; }
    /* ===== شريط التنقل ===== */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0 14px; border-bottom: 1px solid var(--separator);
      margin-bottom: 16px; background: var(--bg);
    }
    .topbar .back-btn {
      font-size: 22px; cursor: pointer; background: rgba(255,255,255,0.06);
      border-radius: 50%; width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      border: none; color: var(--text); font-weight: 600;
    }
    .topbar .brand {
      font-size: 17px; font-weight: 800;
      background: linear-gradient(135deg, #d4a017, #f5d742);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .topbar .actions { display: flex; align-items: center; gap: 12px; }
    .topbar .actions button, .topbar .actions a {
      background: rgba(255,255,255,0.06); border: none; cursor: pointer;
      font-size: 20px; color: var(--text); opacity: 0.7;
      display: flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 50%; text-decoration: none;
    }
    .toggle-dark {
      width: 48px; height: 28px; background: #3a3a3c; border-radius: 28px;
      position: relative; cursor: pointer; transition: 0.3s; flex-shrink: 0;
    }
    .toggle-dark.active { background: #34c759; }
    .toggle-dark .thumb {
      width: 24px; height: 24px; background: white; border-radius: 50%;
      position: absolute; top: 2px; left: 2px;
      transition: 0.3s cubic-bezier(0.3, 1.2, 0.4, 1);
    }
    .toggle-dark.active .thumb { transform: translateX(20px); }

    /* ===== مشغل الفيديو ===== */
    .player-wrapper { display: flex; flex-direction: column; gap: 16px; }
    .video-player {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--separator);
      position: relative;
    }
    .video-player iframe {
      width: 100%; aspect-ratio: 16/9; border: none;
      display: block; background: #000;
    }

    /* ===== زر الفول سكرين المخصص ===== */
    .custom-fullscreen-btn {
      position: absolute;
      bottom: 60px; /* فوق شريط العنوان */
      right: 10px;
      z-index: 60;
      width: 40px; height: 40px;
      border-radius: 10px;
      background: rgba(0,0,0,0.65);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      font-size: 18px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      backdrop-filter: blur(6px);
      transition: 0.2s;
    }
    .custom-fullscreen-btn:hover {
      background: var(--gold);
      color: #000;
      border-color: var(--gold);
    }

    /* ===== الفقاعة الدائرية الصغيرة (الاستيكر المصغّر) ===== */
    .custom-sticker {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 50;

      width: 64px;   /* ✅ صغّرناها */
      height: 64px;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      padding: 4px;

      background:
        radial-gradient(circle at 30% 25%,
          #fff8c4 0%,
          #ffd700 30%,
          #b8860b 75%,
          #6b4a00 100%);

      color: #111;
      font-family: 'Cairo', sans-serif;
      font-size: 9px;   /* ✅ صغّرنا الخط */
      font-weight: 900;
      line-height: 1.15;
      text-shadow: 0 1px 1px rgba(255,255,255,0.5);

      pointer-events: none;
      user-select: none;
      overflow: hidden;

      box-shadow:
        0 0 0 2px rgba(255, 215, 0, 0.6),
        0 0 10px rgba(255, 215, 0, 0.7),
        0 0 20px rgba(255, 215, 0, 0.35),
        inset 0 -5px 10px rgba(0, 0, 0, 0.35),
        inset 0 5px 10px rgba(255, 255, 255, 0.5);

      border: 1.5px solid rgba(255, 255, 255, 0.6);
      opacity: 0.92; /* ✅ شفافية خفيفة عشان الفيديو يبان من وراها */
    }
    .custom-sticker::before {
      content: "";
      position: absolute;
      top: 8%;
      left: 18%;
      width: 55%;
      height: 32%;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        rgba(255,255,255,0.95) 0%,
        rgba(255,255,255,0.6) 40%,
        rgba(255,255,255,0) 75%
      );
      transform: rotate(-20deg);
      pointer-events: none;
    }
    .custom-sticker::after {
      content: "";
      position: absolute;
      bottom: 8%;
      right: 22%;
      width: 20%;
      height: 12%;
      border-radius: 50%;
      background: radial-gradient(
        ellipse at center,
        rgba(255,255,255,0.7) 0%,
        rgba(255,255,255,0) 80%
      );
      pointer-events: none;
    }

    /* ===== حالة الفول سكرين المخصص ===== */
    .video-player:fullscreen {
      border-radius: 0;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
    }
    .video-player:fullscreen iframe {
      width: 100%;
      height: 100%;
      aspect-ratio: auto;
    }
    .video-player:fullscreen .custom-sticker {
      width: 90px;
      height: 90px;
      font-size: 12px;
      top: 16px;
      left: 16px;
      opacity: 0.92;
    }
    .video-player:fullscreen .custom-fullscreen-btn {
      bottom: 20px;
      right: 20px;
    }
    .video-player:-webkit-full-screen {
      width: 100vw; height: 100vh; background: #000;
    }
    .video-player:-webkit-full-screen iframe {
      width: 100%; height: 100%; aspect-ratio: auto;
    }

    .video-info {
      padding: 16px 18px;
      background: var(--card-bg);
    }
    .video-info .lecture-title {
      font-size: 18px; font-weight: 700; color: var(--text);
      margin-bottom: 4px;
    }
    .video-info .lecture-sub {
      font-size: 14px; color: var(--subtext); font-weight: 400;
    }
    /* ===== قائمة التشغيل ===== */
    .playlist {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--separator);
      max-height: 400px;
      overflow-y: auto;
    }
    .playlist-title {
      color: var(--gold); font-weight: 700; font-size: 16px;
      margin-bottom: 12px; padding-bottom: 10px;
      border-bottom: 2px solid var(--separator);
      display: flex; align-items: center; gap: 8px;
    }
    .playlist-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; border-radius: 12px; cursor: pointer;
      transition: all 0.2s ease; margin-bottom: 4px;
      border: 1px solid transparent;
    }
    .playlist-item:hover {
      background: var(--card-hover);
      transform: translateX(-4px);
    }
    .playlist-item.active {
      background: rgba(212,160,23,0.15);
      border-color: var(--gold);
    }
    .playlist-item .index {
      color: var(--gold); font-weight: 700; font-size: 13px;
      min-width: 28px; text-align: center;
    }
    .playlist-item .title {
      color: var(--text); font-size: 15px; font-weight: 500; flex: 1;
    }
    .playlist-item.active .title { color: var(--gold); font-weight: 700; }
    .playlist-item .duration {
      font-size: 12px; color: var(--subtext);
    }
    .playlist-item .play-icon {
      font-size: 18px; color: var(--gold); opacity: 0; transition: 0.2s;
    }
    .playlist-item.active .play-icon,
    .playlist-item:hover .play-icon { opacity: 1; }

    /* ===== حالات خاصة ===== */
    .loading-state {
      display: flex; justify-content: center; align-items: center;
      padding: 40px 0; color: var(--subtext); font-size: 15px; gap: 12px;
    }
    .loading-state::after {
      content: ""; width: 28px; height: 28px;
      border: 3px solid var(--gold); border-top-color: transparent;
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state {
      text-align: center; color: var(--subtext);
      padding: 30px 0; font-size: 15px;
    }
    .error-state {
      text-align: center; color: #ff3b30;
      padding: 30px 0; font-size: 15px;
    }
    /* ===== زر البروفايل ===== */
    .profile-float {
      position: fixed; bottom: 30px; left: 30px;
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--card-bg); border: 2px solid var(--gold);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.3s; z-index: 999;
      text-decoration: none; color: var(--text); font-size: 26px;
    }
    .profile-float:hover {
      transform: scale(1.05); background: var(--gold);
      color: white; border-color: white;
    }
    /* ===== Toast ===== */
    .custom-toast {
      position: fixed; bottom: 100px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
      color: white; padding: 12px 24px; border-radius: 40px;
      font-weight: 600; font-size: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      z-index: 9999;
      animation: toastIn 0.4s ease, toastOut 0.4s ease 2.8s forwards;
      max-width: 85%; white-space: nowrap;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(30px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(30px); } }

    @media (max-width: 480px) {
      .app-container { padding: 0 12px 80px; }
      .video-info .lecture-title { font-size: 16px; }
      .playlist { max-height: 300px; padding: 12px; }
      .playlist-item { padding: 10px 12px; }
      .playlist-item .title { font-size: 14px; }
      .profile-float { width: 48px; height: 48px; bottom: 20px; left: 20px; font-size: 22px; }
      .status-bar { font-size: 12px; }
      .topbar .brand { font-size: 15px; }

      /* ✅ الفقاعة على الموبايل أصغر كمان */
      .custom-sticker {
        top: 6px; left: 6px;
        width: 52px;
        height: 52px;
        font-size: 8px;
        border-width: 1px;
      }
      .custom-fullscreen-btn {
        width: 36px; height: 36px;
        font-size: 16px;
        bottom: 55px; right: 8px;
      }
    }
  </style>
</head>
<body class="dark-mode">

  <!-- ===== زر البروفايل ===== -->

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",

</script>
<script type="module">
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, get, child } from 'firebase/database';

const firebaseConfig = {
  apiKey: "AIzaSyB0p0us6BuzD2ngzjhRnmUIhlOcBeRp0vQ",
  authDomain: "tok-tak-d6e17.firebaseapp.com",
  databaseURL: "https://tok-tak-d6e17-default-rtdb.firebaseio.com",
  projectId: "tok-tak-d6e17",
  storageBucket: "tok-tak-d6e17.appspot.com",
  messagingSenderId: "547062578826",
  appId: "1:547062578826:web:aa285cf798341be07cb773",
  measurementId: "G-7EMKEQKPVV"
};
const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

// ===== عناصر DOM =====
const playlistItems = document.getElementById('playlistItems');
const playerFrame = document.getElementById('playerFrame');
const videoTitle = document.getElementById('videoTitle');
const videoSub = document.getElementById('videoSub');
const darkToggle = document.getElementById('darkToggle');
const shareBtn = document.getElementById('shareBtn');
const notifyBtn = document.getElementById('notifyBtn');
const backBtn = document.getElementById('backBtn');
const videoPlayerBox = document.getElementById('videoPlayerBox');
const customFsBtn = document.getElementById('customFsBtn');

const statusTime = document.getElementById('statusTime');
const statusNetwork = document.getElementById('statusNetwork');
const batteryIcon = document.getElementById('batteryIcon');
const batteryLevel = document.getElementById('batteryLevel');

// ===== معاملات الرابط =====
const urlParams = new URLSearchParams(window.location.search);
const year = urlParams.get('year');
const subject = urlParams.get('subject');
const teacher = urlParams.get('teacher');
const chapter = urlParams.get('chapter');
const lecture = urlParams.get('lecture');

// ===== العودة =====
backBtn.addEventListener('click', () => {
  window.location.href = `lecture_name.html?year=${encodeURIComponent(year || '')}&subject=${encodeURIComponent(subject || '')}&teacher=${encodeURIComponent(teacher || '')}&chapter=${encodeURIComponent(chapter || '')}`;
});

// ===== الوقت =====
function updateTime() {
  const now = new Date();
  statusTime.textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
}
updateTime();
setInterval(updateTime, 1000);

// ===== الشبكة =====
function updateNetwork() {
  const conn = navigator.connection;
  statusNetwork.textContent = '📶';
  if (conn) statusNetwork.title = conn.effectiveType || 'شبكة';
}
updateNetwork();
if (navigator.connection) navigator.connection.addEventListener('change', updateNetwork);

// ===== البطارية =====
async function updateBattery() {
  try {
    if (!navigator.getBattery) { batteryLevel.textContent = '--%'; batteryIcon.textContent = '🔋'; return; }
    const battery = await navigator.getBattery();
    const level = Math.round(battery.level * 100);
    batteryLevel.textContent = `${level}%`;
    batteryIcon.textContent = battery.charging ? '⚡️' : '🔋';
    battery.addEventListener('levelchange', updateBattery);
    battery.addEventListener('chargingchange', updateBattery);
  } catch { batteryLevel.textContent = '--%'; batteryIcon.textContent = '🔋'; }
}
updateBattery();

// ===== Toast =====
function showToast(msg) {
  const existing = document.querySelector('.custom-toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'custom-toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ===== استخراج YouTube ID =====
function extractYouTubeId(url) {
  if (!url) return null;
  const patterns = [
    /(?:youtube\.com\/watch\?v=)([\w-]+)/,
    /(?:youtu\.be\/)([\w-]+)/,
    /(?:youtube\.com\/embed\/)([\w-]+)/,
    /(?:youtube\.com\/v\/)([\w-]+)/,
    /(?:youtube\.com\/shorts\/)([\w-]+)/
  ];
  for (const pattern of patterns) {
    const match = url.match(pattern);
    if (match) return match[1];
  }
  if (/^[\w-]{11}$/.test(url)) return url;
  return null;
}

function getBunnyEmbedUrl(url) {
  if (typeof url !== 'string') return null;
  url = url.trim();
  const match = url.match(
    /^https?:\/\/player\.mediadelivery\.net\/(?:play|embed)\/(\d+)\/([a-f0-9-]+)/i
  );
  if (match) return `https://player.mediadelivery.net/embed/${match[1]}/${match[2]}`;
  return null;
}

function playVideo(video, index, total) {
  const rawUrl = typeof video === 'string'
    ? video
    : video?.url || video?.videoUrl || video?.video_url ||
      video?.stream_url || video?.src || video?.link || '';

  const name = typeof video === 'object' && video
    ? video.name || `فيديو ${index + 1}`
    : `فيديو ${index + 1}`;

  const youtubeId = extractYouTubeId(rawUrl);
  const bunnyUrl = getBunnyEmbedUrl(rawUrl);

  if (youtubeId) {
    playerFrame.src =
      `https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0`;
  } else if (bunnyUrl) {
    playerFrame.src = bunnyUrl;
    playerFrame.allow = 'accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen';
    playerFrame.setAttribute('referrerpolicy', 'origin');
  } else {
    console.error('رابط الفيديو غير مدعوم:', rawUrl);
    showToast('⚠️ رابط الفيديو غير صالح أو غير مدعوم');
    return;
  }

  videoTitle.textContent = name;
  videoSub.textContent = `${lecture || 'محاضرة'} • ${teacher || 'مدرس'}`;

  document.querySelectorAll('.playlist-item')
    .forEach(el => el.classList.remove('active'));

  const items = document.querySelectorAll('.playlist-item');
  if (items[index]) items[index].classList.add('active');
}

// ===== تحميل الفيديوهات =====
async function loadVideos() {
  if (!year || !subject || !teacher || !chapter || !lecture) {
    playlistItems.innerHTML = `<div class="empty-state">⚠️ البيانات غير مكتملة</div>`;
    return;
  }
  try {
    const dbRef = ref(database);
    const teachersSnap = await get(child(dbRef, `years/${year}/subjects/${subject}/teachers`));
    if (!teachersSnap.exists()) {
      playlistItems.innerHTML = `<div class="empty-state">⚠️ لا توجد بيانات</div>`;
      return;
    }
    const teachersData = teachersSnap.val();
    let teacherObj = null;
    if (Array.isArray(teachersData)) {
      teacherObj = teachersData.find(t => (t.teacher_name || t.name || t) === teacher);
    } else {
      teacherObj = teachersData[teacher] || null;
    }
    if (!teacherObj) {
      playlistItems.innerHTML = `<div class="empty-state">⚠️ المدرس غير موجود</div>`;
      return;
    }
    const chapters = teacherObj.chapters || {};
    let chapterObj = null;
    if (Array.isArray(chapters)) {
      chapterObj = chapters.find(c => (c.chapter_name || c.name || c) === chapter);
    } else {
      chapterObj = chapters[chapter] || null;
    }
    if (!chapterObj) {
      playlistItems.innerHTML = `<div class="empty-state">⚠️ الباب غير موجود</div>`;
      return;
    }
    const lectures = chapterObj.lectures || {};
    let lectureObj = null;
    if (Array.isArray(lectures)) {
      lectureObj = lectures.find(l => (l.lecture_name || l.name || l) === lecture);
    } else {
      lectureObj = lectures[lecture] || null;
    }
    if (!lectureObj) {
      playlistItems.innerHTML = `<div class="empty-state">⚠️ المحاضرة غير موجودة</div>`;
      return;
    }
    let videos = lectureObj.videos || [];
    if (!Array.isArray(videos)) videos = Object.values(videos);
    if (videos.length === 0) {
      playlistItems.innerHTML = `<div class="empty-state">⚠️ لا توجد فيديوهات في هذه المحاضرة</div>`;
      return;
    }

    playlistItems.innerHTML = '';
    videos.forEach((video, index) => {
      const item = document.createElement('div');
      item.className = 'playlist-item' + (index === 0 ? ' active' : '');
      const duration = video.duration || '';
      item.innerHTML = `
        <span class="index">#${index + 1}</span>
        <span class="title">${video.name || `فيديو ${index + 1}`}</span>
        ${duration ? `<span class="duration">${duration}</span>` : ''}
        <span class="play-icon">▶</span>
      `;
      item.onclick = () => playVideo(video, index, videos.length);
      playlistItems.appendChild(item);
    });

    if (videos.length > 0) playVideo(videos[0], 0, videos.length);

  } catch (err) {
    console.error(err);
    playlistItems.innerHTML = `<div class="error-state">❌ حدث خطأ أثناء التحميل</div>`;
  }
}
loadVideos();

// ===== تبديل الوضع =====
function toggleTheme() {
  const isLight = document.body.classList.contains('light-mode');
  if (isLight) {
    document.body.classList.remove('light-mode');
    darkToggle.classList.add('active');
    localStorage.setItem('theme', 'dark');
  } else {
    document.body.classList.add('light-mode');
    darkToggle.classList.remove('active');
    localStorage.setItem('theme', 'light');
  }
}
const savedTheme = localStorage.getItem('theme') || 'dark';
if (savedTheme === 'light') {
  document.body.classList.add('light-mode');
  darkToggle.classList.remove('active');
} else {
  darkToggle.classList.add('active');
}
darkToggle.addEventListener('click', toggleTheme);

// ===== مشاركة =====
shareBtn.addEventListener('click', async () => {
  if (navigator.share) {
    try {
      await navigator.share({ title: 'منصة THE BEST', text: 'منصة تعليمية متكاملة', url: window.location.href });
    } catch { showToast('❌ تم إلغاء المشاركة'); }
  } else showToast('المشاركة غير مدعومة');
});

// ===== إشعارات =====
notifyBtn.addEventListener('click', () => showToast('🔔 الإشعارات ستُفعل قريباً!'));

// ===== الفول سكرين المخصص (عشان الفقاعة تفضل ظاهرة) =====
customFsBtn.addEventListener('click', async () => {
  try {
    if (!document.fullscreenElement) {
      if (videoPlayerBox.requestFullscreen) {
        await videoPlayerBox.requestFullscreen();
      } else if (videoPlayerBox.webkitRequestFullscreen) {
        videoPlayerBox.webkitRequestFullscreen();
      }
    } else {
      if (document.exitFullscreen) await document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
    }
  } catch (e) {
    console.warn('Fullscreen error:', e);
  }
});

// تحديث أيقونة الزر حسب حالة الفول سكرين
document.addEventListener('fullscreenchange', () => {
  customFsBtn.textContent = document.fullscreenElement ? '⛶' : '⛶';
});
document.addEventListener('webkitfullscreenchange', () => {
  customFsBtn.textContent = document.webkitFullscreenElement ? '⛶' : '⛶';
});
</script>
