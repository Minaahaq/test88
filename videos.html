<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e0e">
  <title>الفيديوهات - منصة THANAWAYA PLUS</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{--bg:#0a0a0a;--card-bg:#1a1a1a;--card-hover:#2a2a2a;--text:#f5f5f7;--subtext:#98989e;--gold:#d4a017;--gold-light:#f5d742;--shadow:0 8px 40px rgba(0,0,0,.5);--separator:rgba(255,255,255,.06);--radius:20px}
    body.light-mode{--bg:#f2f2f7;--card-bg:#fff;--card-hover:#f0f0f5;--text:#1c1c1e;--subtext:#8e8e93;--shadow:0 8px 40px rgba(0,0,0,.08);--separator:rgba(60,60,67,.08)}
    body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;transition:background .3s,color .3s}
    .app-container{max-width:430px;width:100%;background:var(--bg);min-height:100vh;padding:0 16px 100px;position:relative}
    .status-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 2px 6px;font-size:13px;font-weight:600;color:var(--text);opacity:.7;min-height:36px}
    .status-left,.status-right,.status-battery{display:flex;align-items:center;gap:8px}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 0 14px;border-bottom:1px solid var(--separator);margin-bottom:16px;background:var(--bg)}
    .back-btn{font-size:22px;cursor:pointer;background:rgba(255,255,255,.06);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border:none;color:var(--text)}
    .brand{font-size:17px;font-weight:800;background:linear-gradient(135deg,#d4a017,#f5d742);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .actions{display:flex;align-items:center;gap:10px}
    .actions button,.actions a{background:rgba(255,255,255,.06);border:none;cursor:pointer;font-size:18px;color:var(--text);opacity:.8;display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;text-decoration:none}
    .toggle-dark{width:48px;height:28px;background:#3a3a3c;border-radius:28px;position:relative;cursor:pointer;flex-shrink:0}
    .toggle-dark.active{background:#34c759}.toggle-dark .thumb{width:24px;height:24px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:transform .3s}.toggle-dark.active .thumb{transform:translateX(20px)}
    .player-wrapper{display:flex;flex-direction:column;gap:16px}
    .video-player{background:var(--card-bg);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--separator);position:relative}
    .video-frame-wrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
    .video-frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block;background:#000}

    /* الاستيكر الأصلي للمنصة - تمت إضافته مع الإبقاء عليه */
    .custom-sticker {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 50;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.6),
                  0 0 10px rgba(255, 215, 0, 0.5);
      animation: logoEnter 0.8s cubic-bezier(0.3, 1.4, 0.5, 1) 0.3s both,
                 logoPulse 3s ease-in-out 1.1s infinite;
    }
    @keyframes logoEnter {
      0% { opacity: 0; transform: scale(0) rotate(-180deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes logoPulse {
      0%, 100% {
        box-shadow: 0 0 0 2px rgba(255, 215, 0, 0.6),
                    0 0 10px rgba(255, 215, 0, 0.5);
      }
      50% {
        box-shadow: 0 0 0 3px rgba(255, 215, 0, 0.8),
                    0 0 20px rgba(255, 215, 0, 0.8),
                    0 0 30px rgba(255, 215, 0, 0.4);
      }
    }

    /* شارة المنصة تغطي موضع زر ملء الشاشة داخل إطار الفيديو */
    .player-watermark{position:absolute;z-index:1000;right:8px;bottom:8px;width:39px;height:32px;border-radius:9px;background:rgba(10,10,10,.97);border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold-light);font:900 11px Arial,sans-serif;letter-spacing:.3px;box-shadow:0 0 12px rgba(212,160,23,.35);pointer-events:auto;user-select:none;-webkit-user-select:none}
    .player-watermark::after{content:"";position:absolute;inset:-3px;border-radius:11px;border:1px solid rgba(245,215,66,.2);pointer-events:none}
    .video-info{padding:16px 18px;background:var(--card-bg);display:flex;align-items:center;gap:12px}
    .subject-thumb{width:48px;height:48px;border-radius:50%;flex-shrink:0;overflow:hidden;position:relative;background:linear-gradient(135deg,#d4a017,#f5d742);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(212,160,23,.35)}
    .subject-thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;opacity:0;transition:opacity .5s}.subject-thumb img.loaded{opacity:1}
    .fallback-emoji{position:relative;z-index:1;font-size:22px;color:#fff}
    .info-text{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
    .lecture-title{font-size:16px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .lecture-sub{font-size:13px;color:var(--subtext);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .playlist{background:var(--card-bg);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--separator);max-height:400px;overflow-y:auto}
    .playlist::-webkit-scrollbar{width:4px}.playlist::-webkit-scrollbar-thumb{background:var(--gold);border-radius:10px}
    .playlist-title{color:var(--gold);font-weight:700;font-size:16px;margin-bottom:12px;padding-bottom:10px;border-bottom:2px solid var(--separator);display:flex;align-items:center;gap:8px}
    .playlist-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;cursor:pointer;transition:all .2s;margin-bottom:4px;border:1px solid transparent;position:relative;overflow:hidden;animation:itemIn .35s ease both}
    @keyframes itemIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
    .playlist-item:hover{background:var(--card-hover)}.playlist-item.active{background:rgba(212,160,23,.15);border-color:var(--gold)}
    .playlist-item .index{color:var(--gold);font-weight:700;font-size:13px;min-width:28px;text-align:center}
    .playlist-item .title{color:var(--text);font-size:15px;font-weight:500;flex:1}
    .playlist-item.active .title{color:var(--gold);font-weight:700}
    .playlist-item .duration{font-size:12px;color:var(--subtext)}.play-icon{font-size:18px;color:var(--gold);opacity:0}.playlist-item.active .play-icon,.playlist-item:hover .play-icon{opacity:1}
    .skeleton-playlist{display:flex;align-items:center;gap:12px;padding:12px 14px}.sk-index,.sk-title,.sk-icon{height:16px;border-radius:5px;background:var(--separator);animation:pulse 1.4s infinite}.sk-index{width:28px}.sk-title{flex:1}.sk-icon{width:20px;height:20px}@keyframes pulse{50%{opacity:.4}}
    .empty-state,.error-state{text-align:center;color:var(--subtext);padding:35px 15px;font-size:15px}.empty-state .emoji{display:block;font-size:40px;margin-bottom:10px}.error-state{color:#ff6259}
    .profile-float{position:fixed;bottom:30px;left:30px;width:56px;height:56px;border-radius:50%;background:var(--card-bg);border:2px solid var(--gold);box-shadow:0 8px 30px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:999;text-decoration:none;color:var(--text);font-size:26px}
    .custom-toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);color:#fff;padding:12px 24px;border-radius:40px;font-weight:600;font-size:14px;z-index:9999;max-width:90%;text-align:center}
    #topProgressBar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#d4a017,#f5d742,#d4a017);z-index:99998;transition:width .3s,opacity .4s}
    #splashScreen{position:fixed;inset:0;background:radial-gradient(circle at center,#191919 0%,#08090c 72%);display:flex;align-items:center;justify-content:center;overflow:hidden;z-index:99999;transition:opacity .6s,visibility .6s}
    #splashScreen.hide{opacity:0;visibility:hidden;pointer-events:none}.splash-content{position:relative;z-index:2;width:94%;display:flex;flex-direction:column;align-items:center}
    .splash-glow{position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(212,160,23,.12);filter:blur(75px)}
    .splash-emblem{width:78px;height:78px;display:grid;place-items:center;border:1px solid rgba(245,215,66,.7);border-radius:24px;margin-bottom:26px;color:#f5d742;font-size:30px;font-weight:900;background:linear-gradient(145deg,#222,#0b0b0b);box-shadow:0 0 35px rgba(212,160,23,.15)}
    .splash-logo{font-family:Arial,sans-serif;font-size:clamp(23px,6vw,35px);font-weight:900;letter-spacing:1px;white-space:nowrap;background:linear-gradient(135deg,#d4a017,#fff0a0,#d4a017);background-size:200% 200%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:gradientShift 3s infinite}
    .splash-subtitle{margin-top:12px;color:#858585;font-size:9px;letter-spacing:2px;text-align:center}
    .splash-loader{width:175px;height:3px;margin-top:38px;overflow:hidden;border-radius:10px;background:#292929}.splash-loader-bar{width:45%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#d4a017,#fff0a0,#d4a017);animation:loading 1.4s ease-in-out infinite alternate}
    .splash-text{margin-top:20px;color:#bcbcbc;font-size:12px;text-align:center}.splash-footer{position:absolute;bottom:28px;color:#5d5d5d;font-size:9px;letter-spacing:2px}
    @keyframes loading{from{transform:translateX(60%)}to{transform:translateX(-60%)}}@keyframes gradientShift{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
    @media(max-width:480px){.custom-sticker{top:6px;left:6px;width:52px;height:52px}.app-container{padding:0 12px 80px}.video-info{padding:14px 16px;gap:10px}.subject-thumb{width:42px;height:42px}.lecture-title{font-size:15px}.playlist{max-height:300px;padding:12px}.playlist-item{padding:10px 12px}.playlist-item .title{font-size:14px}.profile-float{width:48px;height:48px;bottom:20px;left:20px;font-size:22px}.status-bar{font-size:12px}.brand{font-size:15px}.player-watermark{right:7px;bottom:7px;width:36px;height:29px;font-size:10px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>

<script type="importmap">
{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js","firebase/database":"https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"}}

<script type="module">
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, get, child } from 'firebase/database';

const firebaseConfig = {
  apiKey: "AIzaSyB0p0us6BuzD2ngzjhRnmUIhlOcBeRp0vQ",
  authDomain: "tok-tak-d6e17.firebaseapp.com",
  databaseURL: "https://tok-tak-d6e17-default-rtdb.firebaseio.com",
  projectId: "tok-tak-d6e17",
  storageBucket: "tok-tak-d6e17.appspot.com",
  messagingSenderId: "547062578826",
  appId: "1:547062578826:web:aa285cf798341be07cb773",
  measurementId: "G-7EMKEQKPVV"
};
const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

const $ = id => document.getElementById(id);
const playlistItems = $('playlistItems');
const playerFrame = $('playerFrame');
const videoTitle = $('videoTitle');
const videoSub = $('videoSub');
const darkToggle = $('darkToggle');
const subjectThumb = $('subjectThumb');
const statusTime = $('statusTime');
const statusNetwork = $('statusNetwork');
const batteryIcon = $('batteryIcon');
const batteryLevel = $('batteryLevel');
const topProgressBar = $('topProgressBar');
const splashScreen = $('splashScreen');

const params = new URLSearchParams(location.search);
const year = params.get('year');
const subject = params.get('subject');
const teacher = params.get('teacher');
const chapter = params.get('chapter');
const lecture = params.get('lecture');

let progress = 0;
const progressInterval = setInterval(() => {
  progress = Math.min(90, progress + Math.random() * 12);
  topProgressBar.style.width = progress + '%';
  if (progress >= 90) clearInterval(progressInterval);
}, 200);

function finishLoading() {
  clearInterval(progressInterval);
  topProgressBar.style.width = '100%';
  setTimeout(() => {
    splashScreen.classList.add('hide');
    topProgressBar.style.opacity = '0';
    setTimeout(() => { topProgressBar.style.display = 'none'; }, 400);
  }, 350);
}

function showToast(message) {
  document.querySelector('.custom-toast')?.remove();
  const toast = document.createElement('div');
  toast.className = 'custom-toast';
  toast.textContent = message;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 2800);
}
function vibrate(ms = 10) { if (navigator.vibrate) navigator.vibrate(ms); }

function loadSubjectImage() {
  if (!subject) return;
  const clean = subject.trim();
  const attempts = [
    `subject/${clean}.jpg`, `subject/${clean}.png`, `subject/${clean}.jpeg`,
    `subject/${clean}.webp`, `subject/${clean.replace(/\s+/g, '_')}.jpg`,
    `subject/${clean.replace(/\s+/g, '-')}.jpg`
  ];
  const img = document.createElement('img');
  img.alt = subject;
  let idx = 0;
  img.onload = () => img.classList.add('loaded');
  img.onerror = () => {
    idx++;
    if (idx < attempts.length) img.src = attempts[idx];
    else img.style.display = 'none';
  };
  img.src = attempts[0];
  subjectThumb.appendChild(img);
}
loadSubjectImage();

$('backBtn').addEventListener('click', () => {
  vibrate();
  location.href = `lecture_name.html?year=${encodeURIComponent(year || '')}&subject=${encodeURIComponent(subject || '')}&teacher=${encodeURIComponent(teacher || '')}&chapter=${encodeURIComponent(chapter || '')}`;
});

function updateTime() {
  const now = new Date();
  statusTime.textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
}
updateTime();
setInterval(updateTime, 1000);

function updateNetwork() {
  const conn = navigator.connection;
  statusNetwork.textContent = '📶';
  if (conn) statusNetwork.title = conn.effectiveType || 'شبكة';
}
updateNetwork();
if (navigator.connection) navigator.connection.addEventListener('change', updateNetwork);

async function updateBattery() {
  try {
    if (!navigator.getBattery) { batteryLevel.textContent = '--%'; batteryIcon.textContent = '🔋'; return; }
    const battery = await navigator.getBattery();
    const update = () => {
      const level = Math.round(battery.level * 100);
      batteryLevel.textContent = `${level}%`;
      batteryIcon.textContent = battery.charging ? '⚡' : (level > 20 ? '🔋' : '🪫');
    };
    update();
    battery.addEventListener('levelchange', update);
    battery.addEventListener('chargingchange', update);
  } catch (_) { batteryLevel.textContent = '--%'; batteryIcon.textContent = '🔋'; }
}
updateBattery();

function extractYouTubeId(url) {
  if (!url) return null;
  const patterns = [
    /(?:youtube\.com\/watch\?v=)([\w-]+)/,
    /(?:youtu\.be\/)([\w-]+)/,
    /(?:youtube\.com\/embed\/)([\w-]+)/,
    /(?:youtube\.com\/v\/)([\w-]+)/,
    /(?:youtube\.com\/shorts\/)([\w-]+)/
  ];
  for (const pattern of patterns) {
    const match = url.match(pattern);
    if (match) return match[1];
  }
  return /^[\w-]{11}$/.test(url) ? url : null;
}
function getBunnyEmbedUrl(url) {
  if (typeof url !== 'string') return null;
  const match = url.trim().match(/^https?:\/\/player\.mediadelivery\.net\/(?:play|embed)\/(\d+)\/([a-f0-9-]+)/i);
  return match ? `https://player.mediadelivery.net/embed/${match[1]}/${match[2]}` : null;
}

function playVideo(video, index, total) {
  const rawUrl = typeof video === 'string' ? video :
    video?.url || video?.videoUrl || video?.video_url || video?.stream_url || video?.src || video?.link || '';
  const name = typeof video === 'object' && video ? (video.name || `فيديو ${index + 1}`) : `فيديو ${index + 1}`;
  const youtubeId = extractYouTubeId(rawUrl);
  const bunnyUrl = getBunnyEmbedUrl(rawUrl);

  if (youtubeId) {
    playerFrame.src = `https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0&fs=0`;
    playerFrame.removeAttribute('allowfullscreen');
    playerFrame.allow = 'accelerometer; autoplay; encrypted-media; picture-in-picture';
  } else if (bunnyUrl) {
    // إخفاء زر ملء الشاشة في Bunny يعتمد على إعدادات المشغل/الحساب؛ الشارة تغطي موضعه بصرياً.
    playerFrame.src = bunnyUrl;
    playerFrame.removeAttribute('allowfullscreen');
    playerFrame.allow = 'accelerometer; autoplay; encrypted-media; picture-in-picture';
    playerFrame.setAttribute('referrerpolicy', 'origin');
  } else {
    console.error('رابط الفيديو غير مدعوم:', rawUrl);
    showToast('⚠️ رابط الفيديو غير صالح أو غير مدعوم');
    return;
  }

  videoTitle.textContent = name;
  videoSub.textContent = `${lecture || 'محاضرة'} • ${teacher || 'مدرس'}`;
  document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
  const items = document.querySelectorAll('.playlist-item');
  if (items[index]) items[index].classList.add('active');
}

async function loadVideos() {
  if (!year || !subject || !teacher || !chapter || !lecture) {
    playlistItems.innerHTML = '<div class="empty-state"><span class="emoji">⚠️</span>البيانات غير مكتملة</div>';
    finishLoading(); return;
  }
  try {
    const dbRef = ref(database);
    const snap = await get(child(dbRef, `years/${year}/subjects/${subject}/teachers`));
    if (!snap.exists()) {
      playlistItems.innerHTML = '<div class="empty-state"><span class="emoji">📭</span>لا توجد بيانات</div>';
      finishLoading(); return;
    }
    const teachersData = snap.val();
    const teacherObj = Array.isArray(teachersData)
      ? teachersData.find(t => (t.teacher_name || t.name || t) === teacher)
      : teachersData[teacher];
    if (!teacherObj) {
      playlistItems.innerHTML = '<div class="empty-state"><span class="emoji">⚠️</span>المدرس غير موجود</div>';
      finishLoading(); return;
    }
    const chapters = teacherObj.chapters || {};
    const chapterObj = Array.isArray(chapters)
      ? chapters.find(c => (c.chapter_name || c.name || c) === chapter)
      : chapters[chapter];
    if (!chapterObj) {
      playlistItems.innerHTML = '<div class="empty-state"><span class="emoji">⚠️</span>الباب غير موجود</div>';
      finishLoading(); return;
    }
    const lectures = chapterObj.lectures || {};
    const lectureObj = Array.isArray(lectures)
      ? lectures.find(l => (l.lecture_name || l.name || l) === lecture)
      : lectures[lecture];
    if (!lectureObj) {
      playlistItems.innerHTML = '<div class="empty-state"><span class="emoji">⚠️</span>المحاضرة غير موجودة</div>';
      finishLoading(); return;
    }
    let videos = lectureObj.videos || [];
    if (!Array.isArray(videos)) videos = Object.values(videos);
    if (!videos.length) {
      playlistItems.innerHTML = '<div class="empty-state"><span class="emoji">📭</span>لا توجد فيديوهات في هذه المحاضرة</div>';
      finishLoading(); return;
    }

    playlistItems.innerHTML = '';
    videos.forEach((video, index) => {
      const item = document.createElement('div');
      item.className = 'playlist-item' + (index === 0 ? ' active' : '');
      item.style.animationDelay = `${index * .06}s`;
      const indexEl = document.createElement('span');
      indexEl.className = 'index';
      indexEl.textContent = `#${index + 1}`;
      const titleEl = document.createElement('span');
      titleEl.className = 'title';
      titleEl.textContent = (video && typeof video === 'object' && video.name) || `فيديو ${index + 1}`;
      item.append(indexEl, titleEl);
      if (video && typeof video === 'object' && video.duration) {
        const durationEl = document.createElement('span');
        durationEl.className = 'duration';
        durationEl.textContent = video.duration;
        item.appendChild(durationEl);
      }
      const playIcon = document.createElement('span');
      playIcon.className = 'play-icon';
      playIcon.textContent = '▶';
      item.appendChild(playIcon);
      item.addEventListener('click', () => {
        vibrate(15);
        playVideo(video, index, videos.length);
      });
      playlistItems.appendChild(item);
    });
    playVideo(videos[0], 0, videos.length);
    finishLoading();
  } catch (err) {
    console.error(err);
    playlistItems.innerHTML = '<div class="error-state">❌ حدث خطأ أثناء التحميل</div>';
    finishLoading();
  }
}
loadVideos();

function toggleTheme() {
  const light = document.body.classList.contains('light-mode');
  document.body.classList.toggle('light-mode', !light);
  darkToggle.classList.toggle('active', light);
  try { localStorage.setItem('theme', light ? 'dark' : 'light'); } catch (_) {}
  vibrate(10);
}
let savedTheme = 'dark';
try { savedTheme = localStorage.getItem('theme') || 'dark'; } catch (_) {}
document.body.classList.toggle('light-mode', savedTheme === 'light');
darkToggle.classList.toggle('active', savedTheme !== 'light');
darkToggle.addEventListener('click', toggleTheme);

$('shareBtn').addEventListener('click', async () => {
  vibrate();
  if (navigator.share) {
    try { await navigator.share({title:'THANAWAYA PLUS',text:'منصة تعليمية متكاملة لطلاب الثانوية العامة',url:location.href}); }
    catch (_) {}
  } else {
    try { await navigator.clipboard.writeText(location.href); showToast('تم نسخ رابط الصفحة'); }
    catch (_) { showToast('المشاركة غير مدعومة في هذا المتصفح'); }
  }
});
$('notifyBtn').addEventListener('click', () => { vibrate(); showToast('🔔 الإشعارات ستُفعل قريباً!'); });
</script>
