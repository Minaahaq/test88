<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0e0e" />
  <title>الفيديوهات - منصة THE BEST</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ============================================= */
    /* ✨ إضافة 1: Splash Screen                      */
    /* ============================================= */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 70%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 99999;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
    }
    #splashScreen.hide { opacity: 0; visibility: hidden; }
    .splash-logo {
      font-size: 48px; font-weight: 900;
      background: linear-gradient(135deg, #d4a017 0%, #f5d742 50%, #d4a017 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1.5px; margin-bottom: 40px;
      animation: splashPulse 2s ease-in-out infinite, gradientShift 3s ease infinite;
      filter: drop-shadow(0 0 30px rgba(212,160,23,0.4));
    }
    @keyframes splashPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }
    @keyframes gradientShift { 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }
    .splash-loader { width: 60px; height: 60px; position: relative; }
    .splash-loader::before, .splash-loader::after {
      content: ""; position: absolute; inset: 0; border-radius: 50%; border: 3px solid transparent;
    }
    .splash-loader::before {
      border-top-color: #d4a017; border-right-color: #d4a017;
      animation: splashSpin 1s linear infinite;
    }
    .splash-loader::after {
      border-bottom-color: #f5d742; border-left-color: #f5d742;
      animation: splashSpin 1.5s linear infinite reverse; inset: 8px;
    }
    @keyframes splashSpin { to { transform: rotate(360deg); } }
    .splash-text {
      margin-top: 28px; color: #f5f5f7; font-size: 14px; font-weight: 600;
      opacity: 0.5; letter-spacing: 3px;
      animation: textBlink 1.5s ease-in-out infinite;
    }
    @keyframes textBlink { 0%,100%{opacity:0.4;} 50%{opacity:0.9;} }
    #topProgressBar {
      position: fixed; top: 0; left: 0; height: 3px; width: 0%;
      background: linear-gradient(90deg, #d4a017, #f5d742, #d4a017);
      background-size: 200% 100%; z-index: 99998;
      transition: width 0.3s ease, opacity 0.4s;
      box-shadow: 0 0 12px rgba(212,160,23,0.8);
      animation: progressShine 2s linear infinite;
    }
    @keyframes progressShine { 0%{background-position:0% 50%;} 100%{background-position:200% 50%;} }
  </style>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0a0a0a;
      --card-bg: #1a1a1a;
      --card-hover: #2a2a2a;
      --text: #f5f5f7;
      --subtext: #98989e;
      --gold: #d4a017;
      --gold-light: #f5d742;
      --shadow: 0 8px 40px rgba(0,0,0,0.5);
      --separator: rgba(255,255,255,0.06);
      --radius: 20px;
    }
    body.light-mode {
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --card-hover: #f0f0f5;
      --text: #1c1c1e;
      --subtext: #8e8e93;
      --shadow: 0 8px 40px rgba(0,0,0,0.08);
      --separator: rgba(60,60,67,0.08);
    }
    body {
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
      display: flex; justify-content: center; align-items: flex-start;
    }
    .app-container {
      max-width: 430px; width: 100%; background: var(--bg);
      min-height: 100vh; padding: 0 16px 100px;
      position: relative; transition: background 0.3s;
    }
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 2px 6px; font-size: 13px; font-weight: 600;
      color: var(--text); opacity: 0.7; min-height: 36px;
    }
    .status-left, .status-right { display: flex; align-items: center; gap: 8px; }
    .status-battery { display: flex; align-items: center; gap: 4px; }
    .battery-level { font-size: 13px; font-weight: 700; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 0 14px; border-bottom: 1px solid var(--separator);
      margin-bottom: 16px; background: var(--bg);
    }
    .topbar .back-btn {
      font-size: 22px; cursor: pointer; background: rgba(255,255,255,0.06);
      border-radius: 50%; width: 38px; height: 38px;
      display: flex; align-items: center; justify-content: center;
      border: none; color: var(--text); font-weight: 600;
      transition: 0.2s;
    }
    .topbar .back-btn:hover { background: rgba(255,255,255,0.12); }
    .topbar .brand {
      font-size: 17px; font-weight: 800;
      background: linear-gradient(135deg, #d4a017, #f5d742);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .topbar .actions { display: flex; align-items: center; gap: 12px; }
    .topbar .actions button, .topbar .actions a {
      background: rgba(255,255,255,0.06); border: none; cursor: pointer;
      font-size: 20px; color: var(--text); opacity: 0.7;
      display: flex; align-items: center; justify-content: center;
      width: 34px; height: 34px; border-radius: 50%; text-decoration: none;
      transition: 0.2s;
    }
    .topbar .actions button:hover, .topbar .actions a:hover {
      opacity: 1; background: rgba(255,255,255,0.12);
    }
    .toggle-dark {
      width: 48px; height: 28px; background: #3a3a3c; border-radius: 28px;
      position: relative; cursor: pointer; transition: 0.3s; flex-shrink: 0;
    }
    .toggle-dark.active { background: #34c759; }
    .toggle-dark .thumb {
      width: 24px; height: 24px; background: white; border-radius: 50%;
      position: absolute; top: 2px; left: 2px;
      transition: 0.3s cubic-bezier(0.3, 1.2, 0.4, 1);
    }
    .toggle-dark.active .thumb { transform: translateX(20px); }

    /* ===== مشغل الفيديو ===== */
    .player-wrapper { display: flex; flex-direction: column; gap: 16px; }
    .video-player {
      background: var(--card-bg);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      border: 1px solid var(--separator);
      position: relative;
    }
    .video-player iframe {
      width: 100%; aspect-ratio: 16/9; border: none;
      display: block; background: #000;
    }

    /* ============================================= */
    /* ✨ إضافة 2: تحسين اللوجو (custom-sticker)      */
    /* ============================================= */
    .custom-sticker {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 50;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      pointer-events: none;
      user-select: none;
      box-shadow:
        0 0 0 2px rgba(255, 215, 0, 0.6),
        0 0 10px rgba(255, 215, 0, 0.5);
      /* ✨ animation دخول + نبض */
      animation: logoEnter 0.8s cubic-bezier(0.3, 1.4, 0.5, 1) 0.3s both,
                 logoPulse 3s ease-in-out 1.1s infinite;
    }
    @keyframes logoEnter {
      0% { opacity: 0; transform: scale(0) rotate(-180deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes logoPulse {
      0%, 100% {
        box-shadow:
          0 0 0 2px rgba(255, 215, 0, 0.6),
          0 0 10px rgba(255, 215, 0, 0.5);
      }
      50% {
        box-shadow:
          0 0 0 3px rgba(255, 215, 0, 0.8),
          0 0 20px rgba(255, 215, 0, 0.8),
          0 0 30px rgba(255, 215, 0, 0.4);
      }
    }

    /* ============================================= */
    /* ✨ إضافة 3: معلومات الفيديو + صورة المادة     */
    /* ============================================= */
    .video-info {
      padding: 16px 18px;
      background: var(--card-bg);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .video-info .subject-thumb {
      width: 48px; height: 48px; border-radius: 50%;
      flex-shrink: 0;
      overflow: hidden; position: relative;
      background: linear-gradient(135deg, #d4a017, #f5d742);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 12px rgba(212,160,23,0.35);
    }
    .video-info .subject-thumb img {
      width: 100%; height: 100%; object-fit: cover;
      position: absolute; inset: 0;
      opacity: 0; filter: blur(8px);
      transition: opacity 0.5s, filter 0.5s;
    }
    .video-info .subject-thumb img.loaded {
      opacity: 1; filter: blur(0);
    }
    .video-info .subject-thumb .fallback-emoji {
      position: relative; z-index: 1;
      font-size: 22px;
      color: white;
    }
    .video-info .info-text {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; gap: 4px;
    }
    .video-info .lecture-title {
      font-size: 16px; font-weight: 700; color: var(--text);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .video-info .lecture-sub {
      font-size: 13px; color: var(--subtext); font-weight: 400;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }

    /* ===== قائمة التشغيل ===== */
    .playlist {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--separator);
      max-height: 400px;
      overflow-y: auto;
    }
    .playlist::-webkit-scrollbar { width: 4px; }
    .playlist::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
    .playlist-title {
      color: var(--gold); font-weight: 700; font-size: 16px;
      margin-bottom: 12px; padding-bottom: 10px;
      border-bottom: 2px solid var(--separator);
      display: flex; align-items: center; gap: 8px;
    }
    .playlist-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; border-radius: 12px; cursor: pointer;
      transition: all 0.2s ease; margin-bottom: 4px;
      border: 1px solid transparent;
      position: relative; overflow: hidden;
      opacity: 0; transform: translateX(-15px);
      animation: playlistItemIn 0.5s cubic-bezier(0.2, 0.9, 0.4, 1) forwards;
    }
    @keyframes playlistItemIn { to { opacity: 1; transform: translateX(0); } }
    .playlist-item:hover {
      background: var(--card-hover);
      transform: translateX(-4px);
    }
    .playlist-item.active {
      background: rgba(212,160,23,0.15);
      border-color: var(--gold);
    }
    .playlist-item .index {
      color: var(--gold); font-weight: 700; font-size: 13px;
      min-width: 28px; text-align: center;
    }
    .playlist-item .title {
      color: var(--text); font-size: 15px; font-weight: 500; flex: 1;
    }
    .playlist-item.active .title { color: var(--gold); font-weight: 700; }
    .playlist-item .duration {
      font-size: 12px; color: var(--subtext);
    }
    .playlist-item .play-icon {
      font-size: 18px; color: var(--gold); opacity: 0; transition: 0.2s;
    }
    .playlist-item.active .play-icon,
    .playlist-item:hover .play-icon { opacity: 1; }

    /* Ripple */
    .ripple {
      position: absolute; border-radius: 50%;
      background: rgba(212,160,23,0.4);
      transform: scale(0);
      animation: rippleAnim 0.6s ease-out;
      pointer-events: none; z-index: 10;
    }
    @keyframes rippleAnim { to { transform: scale(4); opacity: 0; } }

    /* Skeleton Loading */
    .skeleton-playlist {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; margin-bottom: 4px;
      pointer-events: none;
    }
    .skeleton-playlist .sk-index {
      width: 28px; height: 16px; border-radius: 4px;
      background: var(--separator);
      animation: skeletonPulse 1.4s ease-in-out infinite;
    }
    .skeleton-playlist .sk-title {
      flex: 1; height: 16px; border-radius: 6px;
      background: var(--separator);
      animation: skeletonPulse 1.4s ease-in-out infinite;
    }
    .skeleton-playlist .sk-icon {
      width: 20px; height: 20px; border-radius: 50%;
      background: var(--separator);
      animation: skeletonPulse 1.4s ease-in-out infinite;
    }
    @keyframes skeletonPulse {
      0%,100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* حالات خاصة */
    .empty-state {
      text-align: center; color: var(--subtext);
      padding: 40px 20px; font-size: 15px;
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
    }
    .empty-state .emoji { font-size: 44px; opacity: 0.5; }
    .error-state {
      text-align: center; color: #ff3b30;
      padding: 30px 0; font-size: 15px;
    }

    /* زر البروفايل */
    .profile-float {
      position: fixed; bottom: 30px; left: 30px;
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--card-bg); border: 2px solid var(--gold);
      box-shadow: 0 8px 30px rgba(0,0,0,0.3);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: 0.3s; z-index: 999;
      text-decoration: none; color: var(--text); font-size: 26px;
    }
    .profile-float:hover {
      transform: scale(1.05); background: var(--gold);
      color: white; border-color: white;
    }

    /* Toast */
    .custom-toast {
      position: fixed; bottom: 100px; left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85); backdrop-filter: blur(12px);
      color: white; padding: 12px 24px; border-radius: 40px;
      font-weight: 600; font-size: 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      z-index: 9999;
      animation: toastIn 0.4s ease, toastOut 0.4s ease 2.8s forwards;
      max-width: 85%; white-space: nowrap;
    }
    @keyframes toastIn { from{opacity:0;transform:translateX(-50%) translateY(30px);} to{opacity:1;transform:translateX(-50%) translateY(0);} }
    @keyframes toastOut { to{opacity:0;transform:translateX(-50%) translateY(30px);} }

    @media (max-width: 480px) {
      .app-container { padding: 0 12px 80px; }
      .video-info { padding: 14px 16px; gap: 10px; }
      .video-info .subject-thumb { width: 42px; height: 42px; }
      .video-info .lecture-title { font-size: 15px; }
      .playlist { max-height: 300px; padding: 12px; }
      .playlist-item { padding: 10px 12px; }
      .playlist-item .title { font-size: 14px; }
      .profile-float { width: 48px; height: 48px; bottom: 20px; left: 20px; font-size: 22px; }
      .status-bar { font-size: 12px; }
      .topbar .brand { font-size: 15px; }
      .custom-sticker {
        top: 6px; left: 6px;
        width: 52px; height: 52px;
      }
    }
  </style>
</head>

<script type="importmap">
{

<script type="module">
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, get, child } from 'firebase/database';

const firebaseConfig = {
  apiKey: "AIzaSyB0p0us6BuzD2ngzjhRnmUIhlOcBeRp0vQ",
  authDomain: "tok-tak-d6e17.firebaseapp.com",
  databaseURL: "https://tok-tak-d6e17-default-rtdb.firebaseio.com",
  projectId: "tok-tak-d6e17",
  storageBucket: "tok-tak-d6e17.appspot.com",
  messagingSenderId: "547062578826",
  appId: "1:547062578826:web:aa285cf798341be07cb773",
  measurementId: "G-7EMKEQKPVV"
};
const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

const playlistItems = document.getElementById('playlistItems');
const playerFrame = document.getElementById('playerFrame');
const videoTitle = document.getElementById('videoTitle');
const videoSub = document.getElementById('videoSub');
const darkToggle = document.getElementById('darkToggle');
const shareBtn = document.getElementById('shareBtn');
const notifyBtn = document.getElementById('notifyBtn');
const backBtn = document.getElementById('backBtn');
const subjectThumb = document.getElementById('subjectThumb');
const statusTime = document.getElementById('statusTime');
const statusNetwork = document.getElementById('statusNetwork');
const batteryIcon = document.getElementById('batteryIcon');
const batteryLevel = document.getElementById('batteryLevel');

const urlParams = new URLSearchParams(window.location.search);
const year = urlParams.get('year');
const subject = urlParams.get('subject');
const teacher = urlParams.get('teacher');
const chapter = urlParams.get('chapter');
const lecture = urlParams.get('lecture');

// ===== Splash + Progress =====
const topProgressBar = document.getElementById('topProgressBar');
const splashScreen = document.getElementById('splashScreen');
let progress = 0;
const progressInterval = setInterval(() => {
  progress += Math.random() * 12;
  if (progress >= 90) { progress = 90; clearInterval(progressInterval); }
  topProgressBar.style.width = progress + '%';
}, 200);

function finishLoading() {
  clearInterval(progressInterval);
  topProgressBar.style.width = '100%';
  setTimeout(() => {
    splashScreen.classList.add('hide');
    topProgressBar.style.opacity = '0';
    setTimeout(() => { topProgressBar.style.display = 'none'; }, 400);
  }, 500);
}

// =============================================
// ✨ صورة المادة في معلومات الفيديو
// =============================================
function loadSubjectImage() {
  if (!subject) return;
  const clean = subject.trim();
  const attempts = [
    `subject/${clean}.jpg`,
    `subject/${clean}.png`,
    `subject/${clean}.jpeg`,
    `subject/${clean}.webp`,
    `subject/${clean.replace(/\s+/g, '_')}.jpg`,
    `subject/${clean.replace(/\s+/g, '-')}.jpg`
  ];

  const img = document.createElement('img');
  img.alt = subject;
  img.loading = 'lazy';
  let idx = 0;
  img.onload = () => { img.classList.add('loaded'); };
  img.onerror = () => {
    idx++;
    if (idx < attempts.length) img.src = attempts[idx];
    else img.style.display = 'none';
  };
  img.src = attempts[0];
  subjectThumb.appendChild(img);
}
loadSubjectImage();

// ===== Haptic =====
function vibrate(ms = 10) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

// ===== Ripple =====
function createRipple(e, el) {
  const rect = el.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left - size / 2;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top - size / 2;
  ripple.style.left = x + 'px';
  ripple.style.top = y + 'px';
  el.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
}

// ===== العودة =====
backBtn.addEventListener('click', () => {
  vibrate(10);
  window.location.href = `lecture_name.html?year=${encodeURIComponent(year || '')}&subject=${encodeURIComponent(subject || '')}&teacher=${encodeURIComponent(teacher || '')}&chapter=${encodeURIComponent(chapter || '')}`;
});

// ===== الوقت =====
function updateTime() {
  const now = new Date();
  statusTime.textContent = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
}
updateTime();
setInterval(updateTime, 1000);

// ===== الشبكة =====
function updateNetwork() {
  const conn = navigator.connection;
  statusNetwork.textContent = '📶';
  if (conn) statusNetwork.title = conn.effectiveType || 'شبكة';
}
updateNetwork();
if (navigator.connection) navigator.connection.addEventListener('change', updateNetwork);

// ===== البطارية =====
async function updateBattery() {
  try {
    if (!navigator.getBattery) { batteryLevel.textContent = '--%'; batteryIcon.textContent = '🔋'; return; }
    const battery = await navigator.getBattery();
    const level = Math.round(battery.level * 100);
    batteryLevel.textContent = `${level}%`;
    batteryIcon.textContent = battery.charging ? '⚡️' : (level > 20 ? '🔋' : '🪫');
    battery.addEventListener('levelchange', updateBattery);
    battery.addEventListener('chargingchange', updateBattery);
  } catch { batteryLevel.textContent = '--%'; batteryIcon.textContent = '🔋'; }
}
updateBattery();

// ===== Toast =====
function showToast(msg) {
  const existing = document.querySelector('.custom-toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'custom-toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// ===== استخراج YouTube ID =====
function extractYouTubeId(url) {
  if (!url) return null;
  const patterns = [
    /(?:youtube\.com\/watch\?v=)([\w-]+)/,
    /(?:youtu\.be\/)([\w-]+)/,
    /(?:youtube\.com\/embed\/)([\w-]+)/,
    /(?:youtube\.com\/v\/)([\w-]+)/,
    /(?:youtube\.com\/shorts\/)([\w-]+)/
  ];
  for (const pattern of patterns) {
    const match = url.match(pattern);
    if (match) return match[1];
  }
  if (/^[\w-]{11}$/.test(url)) return url;
  return null;
}

function getBunnyEmbedUrl(url) {
  if (typeof url !== 'string') return null;
  url = url.trim();
  const match = url.match(
    /^https?:\/\/player\.mediadelivery\.net\/(?:play|embed)\/(\d+)\/([a-f0-9-]+)/i
  );
  if (match) return `https://player.mediadelivery.net/embed/${match[1]}/${match[2]}`;
  return null;
}

function playVideo(video, index, total) {
  const rawUrl = typeof video === 'string'
    ? video
    : video?.url || video?.videoUrl || video?.video_url ||
      video?.stream_url || video?.src || video?.link || '';

  const name = typeof video === 'object' && video
    ? video.name || `فيديو ${index + 1}`
    : `فيديو ${index + 1}`;

  const youtubeId = extractYouTubeId(rawUrl);
  const bunnyUrl = getBunnyEmbedUrl(rawUrl);

  if (youtubeId) {
    playerFrame.src =
      `https://www.youtube.com/embed/${youtubeId}?autoplay=1&rel=0`;
  } else if (bunnyUrl) {
    playerFrame.src = bunnyUrl;
    playerFrame.allow = 'accelerometer; autoplay; encrypted-media; picture-in-picture; fullscreen';
    playerFrame.setAttribute('referrerpolicy', 'origin');
  } else {
    console.error('رابط الفيديو غير مدعوم:', rawUrl);
    showToast('⚠️ رابط الفيديو غير صالح أو غير مدعوم');
    return;
  }

  videoTitle.textContent = name;
  videoSub.textContent = `${lecture || 'محاضرة'} • ${teacher || 'مدرس'}`;

  document.querySelectorAll('.playlist-item')
    .forEach(el => el.classList.remove('active'));

  const items = document.querySelectorAll('.playlist-item');
  if (items[index]) items[index].classList.add('active');
}

// ===== تحميل الفيديوهات =====
async function loadVideos() {
  if (!year || !subject || !teacher || !chapter || !lecture) {
    playlistItems.innerHTML = `<div class="empty-state"><span class="emoji">⚠️</span>البيانات غير مكتملة</div>`;
    finishLoading();
    return;
  }
  try {
    const dbRef = ref(database);
    const teachersSnap = await get(child(dbRef, `years/${year}/subjects/${subject}/teachers`));
    if (!teachersSnap.exists()) {
      playlistItems.innerHTML = `<div class="empty-state"><span class="emoji">📭</span>لا توجد بيانات</div>`;
      finishLoading();
      return;
    }
    const teachersData = teachersSnap.val();
    let teacherObj = null;
    if (Array.isArray(teachersData)) {
      teacherObj = teachersData.find(t => (t.teacher_name || t.name || t) === teacher);
    } else {
      teacherObj = teachersData[teacher] || null;
    }
    if (!teacherObj) {
      playlistItems.innerHTML = `<div class="empty-state"><span class="emoji">⚠️</span>المدرس غير موجود</div>`;
      finishLoading();
      return;
    }
    const chapters = teacherObj.chapters || {};
    let chapterObj = null;
    if (Array.isArray(chapters)) {
      chapterObj = chapters.find(c => (c.chapter_name || c.name || c) === chapter);
    } else {
      chapterObj = chapters[chapter] || null;
    }
    if (!chapterObj) {
      playlistItems.innerHTML = `<div class="empty-state"><span class="emoji">⚠️</span>الباب غير موجود</div>`;
      finishLoading();
      return;
    }
    const lectures = chapterObj.lectures || {};
    let lectureObj = null;
    if (Array.isArray(lectures)) {
      lectureObj = lectures.find(l => (l.lecture_name || l.name || l) === lecture);
    } else {
      lectureObj = lectures[lecture] || null;
    }
    if (!lectureObj) {
      playlistItems.innerHTML = `<div class="empty-state"><span class="emoji">⚠️</span>المحاضرة غير موجودة</div>`;
      finishLoading();
      return;
    }
    let videos = lectureObj.videos || [];
    if (!Array.isArray(videos)) videos = Object.values(videos);
    if (videos.length === 0) {
      playlistItems.innerHTML = `<div class="empty-state"><span class="emoji">📭</span>لا توجد فيديوهات في هذه المحاضرة</div>`;
      finishLoading();
      return;
    }

    playlistItems.innerHTML = '';
    videos.forEach((video, index) => {
      const item = document.createElement('div');
      item.className = 'playlist-item' + (index === 0 ? ' active' : '');
      item.style.animationDelay = (index * 0.06) + 's';
      const duration = video.duration || '';
      item.innerHTML = `
        <span class="index">#${index + 1}</span>
        <span class="title">${video.name || `فيديو ${index + 1}`}</span>
        ${duration ? `<span class="duration">${duration}</span>` : ''}
        <span class="play-icon">▶</span>
      `;
      item.onclick = (e) => {
        vibrate(15);
        createRipple(e, item);
        setTimeout(() => playVideo(video, index, videos.length), 100);
      };
      playlistItems.appendChild(item);
    });

    if (videos.length > 0) playVideo(videos[0], 0, videos.length);

    finishLoading();

  } catch (err) {
    console.error(err);
    playlistItems.innerHTML = `<div class="error-state">❌ حدث خطأ أثناء التحميل</div>`;
    finishLoading();
  }
}
loadVideos();

// ===== تبديل الوضع =====
function toggleTheme() {
  const isLight = document.body.classList.contains('light-mode');
  if (isLight) {
    document.body.classList.remove('light-mode');
    darkToggle.classList.add('active');
    localStorage.setItem('theme', 'dark');
  } else {
    document.body.classList.add('light-mode');
    darkToggle.classList.remove('active');
    localStorage.setItem('theme', 'light');
  }
  vibrate(10);
}
const savedTheme = localStorage.getItem('theme') || 'dark';
if (savedTheme === 'light') {
  document.body.classList.add('light-mode');
  darkToggle.classList.remove('active');
} else {
  darkToggle.classList.add('active');
}
darkToggle.addEventListener('click', toggleTheme);

// ===== مشاركة =====
shareBtn.addEventListener('click', async () => {
  vibrate(10);
  if (navigator.share) {
    try {
      await navigator.share({ title: 'منصة THE BEST', text: 'منصة تعليمية متكاملة', url: window.location.href });
    } catch { showToast('❌ تم إلغاء المشاركة'); }
  } else showToast('المشاركة غير مدعومة');
});

// ===== إشعارات =====
notifyBtn.addEventListener('click', () => {
  vibrate(10);
  showToast('🔔 الإشعارات ستُفعل قريباً!');
});
</script>
