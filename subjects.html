<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0e0e0e" />
  <title>المواد - منصة THE BEST</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />

  <style>
    /* ============================================= */
    /* ✨ إضافة 1: Splash Screen (لودنج البداية)      */
    /* ============================================= */
    #splashScreen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1a1a1a 0%, #0e0e0e 70%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.8s;
    }
    #splashScreen.hide {
      opacity: 0;
      visibility: hidden;
    }
    .splash-logo {
      font-size: 48px;
      font-weight: 900;
      background: linear-gradient(135deg, #d4a017 0%, #f5d742 50%, #d4a017 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -1.5px;
      margin-bottom: 40px;
      animation: splashPulse 2s ease-in-out infinite, gradientShift 3s ease infinite;
      filter: drop-shadow(0 0 30px rgba(212,160,23,0.4));
    }
    @keyframes splashPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .splash-loader {
      width: 60px;
      height: 60px;
      position: relative;
    }
    .splash-loader::before,
    .splash-loader::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 3px solid transparent;
    }
    .splash-loader::before {
      border-top-color: #d4a017;
      border-right-color: #d4a017;
      animation: splashSpin 1s linear infinite;
    }
    .splash-loader::after {
      border-bottom-color: #f5d742;
      border-left-color: #f5d742;
      animation: splashSpin 1.5s linear infinite reverse;
      inset: 8px;
    }
    @keyframes splashSpin { to { transform: rotate(360deg); } }
    .splash-text {
      margin-top: 28px;
      color: #f5f5f7;
      font-size: 14px;
      font-weight: 600;
      opacity: 0.5;
      letter-spacing: 3px;
      animation: textBlink 1.5s ease-in-out infinite;
    }
    @keyframes textBlink {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.9; }
    }

    /* شريط تقدم علوي */
    #topProgressBar {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      width: 0%;
      background: linear-gradient(90deg, #d4a017, #f5d742, #d4a017);
      background-size: 200% 100%;
      z-index: 99998;
      transition: width 0.3s ease, opacity 0.4s;
      box-shadow: 0 0 12px rgba(212,160,23,0.8);
      animation: progressShine 2s linear infinite;
    }
    @keyframes progressShine {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
  </style>

  <style>
    /* ===== RESET & ROOT ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --gold: #d4a017;
      --gold-light: #f5d742;
      --shadow: 0 8px 30px rgba(0,0,0,0.08);
      --topbar-bg: rgba(255,255,255,0.92);
    }
    body.light-mode {
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --topbar-bg: rgba(255,255,255,0.92);
    }
    body.dark-mode {
      --bg: #0e0e0e;
      --card-bg: #1c1c1e;
      --text: #f5f5f7;
      --topbar-bg: rgba(30,30,30,0.92);
      --shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    body {
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 0;
      margin: 0;
      min-height: 100vh;
      transition: background 0.3s, color 0.3s;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .app-container {
      max-width: 430px;
      width: 100%;
      background: var(--bg);
      min-height: 100vh;
      padding: 0 20px 100px;
      position: relative;
      transition: background 0.3s;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 6px 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      opacity: 0.8;
      letter-spacing: 0.2px;
      min-height: 40px;
    }
    .status-left, .status-right { display: flex; align-items: center; gap: 8px; }
    .status-right span { font-size: 15px; }
    .status-battery { display: flex; align-items: center; gap: 4px; }
    .battery-level { font-size: 14px; font-weight: 700; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 16px;
      border-bottom: 1px solid rgba(60,60,67,0.08);
      margin-bottom: 20px;
      background: var(--bg);
      transition: background 0.3s;
    }
    .topbar .back-btn {
      font-size: 24px;
      cursor: pointer;
      background: none;
      border: none;
      color: var(--text);
      opacity: 0.7;
      transition: 0.2s;
      padding: 4px 8px;
      border-radius: 12px;
    }
    .topbar .back-btn:hover { opacity: 1; background: rgba(0,0,0,0.05); }
    .topbar .brand { font-size: 18px; font-weight: 700; color: var(--text); opacity: 0.9; }
    .topbar .actions { display: flex; align-items: center; gap: 18px; }
    .topbar .actions button, .topbar .actions a {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 22px;
      color: var(--text);
      opacity: 0.8;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0,0,0,0.04);
      text-decoration: none;
    }
    .topbar .actions button:hover, .topbar .actions a:hover {
      opacity: 1;
      background: rgba(0,0,0,0.08);
    }
    .toggle-dark {
      width: 52px;
      height: 30px;
      background: #e9e9ed;
      border-radius: 30px;
      position: relative;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }
    .toggle-dark.active { background: #34c759; }
    .toggle-dark .thumb {
      width: 26px;
      height: 26px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: 0.3s cubic-bezier(0.3, 1.2, 0.4, 1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .toggle-dark.active .thumb { transform: translateX(22px); }
    .page-title {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 28px;
      letter-spacing: -0.5px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-title span { background: var(--gold); color: white; font-size: 16px; padding: 4px 14px; border-radius: 40px; font-weight: 600; }

    /* ============================================= */
    /* ✨ إضافة 2: كروت المواد بالصور (بانر كامل)    */
    /* ============================================= */
    .subjects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
    }
    .subject-card {
      background: var(--card-bg);
      border-radius: 24px;
      box-shadow: var(--shadow);
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.4, 1), box-shadow 0.3s;
      cursor: pointer;
      text-align: center;
      font-weight: 700;
      color: var(--text);
      border: 1px solid rgba(212,160,23,0.05);
      user-select: none;
      position: relative;
      overflow: hidden;
      aspect-ratio: 1 / 1.15;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transform: translateY(20px);
      animation: cardFadeIn 0.5s cubic-bezier(0.2, 0.9, 0.4, 1) forwards;
    }
    @keyframes cardFadeIn {
      to { opacity: 1; transform: translateY(0); }
    }
    .subject-card:active {
      transform: scale(0.94);
      box-shadow: 0 0 0 2px var(--gold), 0 4px 16px rgba(212,160,23,0.3);
    }
    .subject-card .subject-image {
      width: 100%;
      height: 100%;
      position: absolute;
      inset: 0;
      object-fit: cover;
      transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.4, 1), filter 0.5s, opacity 0.5s;
      z-index: 1;
      filter: blur(12px);
      opacity: 0;
    }
    .subject-card .subject-image.loaded {
      filter: blur(0);
      opacity: 1;
    }
    .subject-card:hover .subject-image.loaded {
      transform: scale(1.08);
    }
    .subject-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,0.15) 50%,
        rgba(0,0,0,0.78) 100%
      );
      z-index: 2;
      pointer-events: none;
      border-radius: 24px;
    }
    .subject-card .subject-fallback {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.5rem;
      background: linear-gradient(135deg, #1a1a1a 0%, #2a2a2a 100%);
      z-index: 1;
      transition: opacity 0.4s;
    }
    body.light-mode .subject-card .subject-fallback {
      background: linear-gradient(135deg, #f5e6c8 0%, #e6d4a8 100%);
    }
    .subject-card .subject-label {
      position: relative;
      z-index: 3;
      margin-top: auto;
      padding: 16px 10px;
      font-size: 1.05rem;
      font-weight: 800;
      color: #ffffff !important;
      text-shadow: 0 2px 12px rgba(0,0,0,0.9);
      line-height: 1.3;
      letter-spacing: -0.3px;
    }

    /* Skeleton */
    .subject-card.skeleton {
      background: var(--card-bg);
      pointer-events: none;
    }
    .subject-card.skeleton::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.08) 50%, transparent 100%);
      background-size: 200% 100%;
      animation: skeletonShine 1.5s infinite;
      z-index: 5;
    }
    @keyframes skeletonShine {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* Ripple */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      transform: scale(0);
      animation: rippleAnim 0.6s ease-out;
      pointer-events: none;
      z-index: 10;
    }
    @keyframes rippleAnim {
      to { transform: scale(4); opacity: 0; }
    }

    .profile-float {
      position: fixed;
      bottom: 30px;
      left: 30px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 2px solid var(--gold);
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.3s;
      z-index: 999;
      text-decoration: none;
      color: var(--text);
      font-size: 28px;
    }
    .profile-float:hover { transform: scale(1.05); background: var(--gold); color: white; border-color: white; }
    .custom-toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      color: white;
      padding: 14px 28px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      z-index: 9999;
      animation: toastIn 0.4s ease, toastOut 0.4s ease 2.8s forwards;
      max-width: 85%;
      white-space: nowrap;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(30px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(30px); } }
    @media (max-width: 480px) {
      .app-container { padding: 0 16px 80px; }
      .page-title { font-size: 24px; }
      .subjects-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
      .subject-card .subject-label { font-size: 0.95rem; padding: 12px 8px; }
      .profile-float { width: 50px; height: 50px; bottom: 20px; left: 20px; font-size: 22px; }
      .status-bar { font-size: 12px; }
    }
  </style>
</head>
<body>

<div id="topProgressBar"></div>

<div id="splashScreen">
  <div class="splash-logo">THE BEST</div>
  <div class="splash-loader"></div>
  <div class="splash-text">جاري التحميل...</div>
</div>

<!-- ✨ تفعيل الوضع الليلي قبل الرسم -->
<script>
  (function() {
    try {
      var saved = localStorage.getItem('theme');
      var theme = saved || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      document.addEventListener('DOMContentLoaded', function() {
        if (theme === 'dark') {
          document.body.classList.add('dark-mode');
        } else {
          document.body.classList.add('light-mode');
        }
      });
    } catch(e) {}
  })();
</script>

<div class="app-container" id="app">

  <div class="status-bar">

    <div class="status-right">
      <span id="statusNetwork">📶</span>

  <div class="topbar">

      <div class="toggle-dark" id="darkToggle">

      </div>
      <a href="https://wa.me/" target="_blank" aria-label="واتساب">💬</a>
      <button id="shareBtn" aria-label="مشاركة">📤</button>
      <button id="notifyBtn" aria-label="إشعارات">🔔</button>

<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
    "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
  }
}
</script>
<script type="module">
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, get, child } from 'firebase/database';

const firebaseConfig = {
  apiKey: "AIzaSyB0p0us6BuzD2ngzjhRnmUIhlOcBeRp0vQ",
  authDomain: "tok-tak-d6e17.firebaseapp.com",
  databaseURL: "https://tok-tak-d6e17-default-rtdb.firebaseio.com",
  projectId: "tok-tak-d6e17",
  storageBucket: "tok-tak-d6e17.appspot.com",
  messagingSenderId: "547062578826",
  appId: "1:547062578826:web:aa285cf798341be07cb773",
  measurementId: "G-7EMKEQKPVV"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

const subjectsList = document.getElementById('subjectsList');
const pageTitle = document.getElementById('pageTitle');
const yearBadge = document.getElementById('yearBadge');
const darkToggle = document.getElementById('darkToggle');
const shareBtn = document.getElementById('shareBtn');
const notifyBtn = document.getElementById('notifyBtn');
const backBtn = document.getElementById('backBtn');

const statusTime = document.getElementById('statusTime');
const statusNetwork = document.getElementById('statusNetwork');
const batteryIcon = document.getElementById('batteryIcon');
const batteryLevel = document.getElementById('batteryLevel');

// استخراج السنة من URL
const urlParams = new URLSearchParams(window.location.search);
const year = urlParams.get('year');

if (year) {
  yearBadge.textContent = year;
  pageTitle.innerHTML = `📚 المواد <span id="yearBadge">${year}</span>`;
} else {
  yearBadge.textContent = 'غير محدد';
}

// =============================================
// ✨ شريط التقدم + Splash
// =============================================
const topProgressBar = document.getElementById('topProgressBar');
const splashScreen = document.getElementById('splashScreen');

let progress = 0;
const progressInterval = setInterval(() => {
  progress += Math.random() * 12;
  if (progress >= 90) {
    progress = 90;
    clearInterval(progressInterval);
  }
  topProgressBar.style.width = progress + '%';
}, 200);

function finishLoading() {
  clearInterval(progressInterval);
  topProgressBar.style.width = '100%';
  setTimeout(() => {
    splashScreen.classList.add('hide');
    topProgressBar.style.opacity = '0';
    setTimeout(() => { topProgressBar.style.display = 'none'; }, 400);
  }, 500);
}

// الوقت
function updateTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  statusTime.textContent = `${h}:${m}`;
}
updateTime();
setInterval(updateTime, 1000);

// الشبكة
function updateNetwork() {
  const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if (!connection) { statusNetwork.textContent = '📶'; return; }
  statusNetwork.textContent = '📶';
}
updateNetwork();
if (navigator.connection) navigator.connection.addEventListener('change', updateNetwork);

// البطارية
async function updateBattery() {
  try {
    if (!navigator.getBattery) {
      batteryLevel.textContent = '--%';
      batteryIcon.textContent = '🔋';
      return;
    }
    const battery = await navigator.getBattery();
    const level = Math.round(battery.level * 100);
    batteryLevel.textContent = `${level}%`;
    if (battery.charging) batteryIcon.textContent = '⚡️';
    else batteryIcon.textContent = level > 20 ? '🔋' : '🪫';
    battery.addEventListener('levelchange', updateBattery);
    battery.addEventListener('chargingchange', updateBattery);
  } catch {
    batteryLevel.textContent = '--%';
    batteryIcon.textContent = '🔋';
  }
}
updateBattery();

// Toast
function showToast(msg) {
  const existing = document.querySelector('.custom-toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'custom-toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
}

// Haptic
function vibrate(ms = 10) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

// Ripple
function createRipple(e, el) {
  const rect = el.getBoundingClientRect();
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  const size = Math.max(rect.width, rect.height);
  ripple.style.width = ripple.style.height = size + 'px';
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left - size / 2;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top - size / 2;
  ripple.style.left = x + 'px';
  ripple.style.top = y + 'px';
  el.appendChild(ripple);
  setTimeout(() => ripple.remove(), 600);
}

// =============================================
// ✨ تحميل المواد بالصور من فولدر /subject/
// =============================================
async function loadSubjects() {
  if (!year) {
    subjectsList.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px 20px;opacity:0.6;">⚠️ لم يتم تحديد السنة</div>`;
    finishLoading();
    return;
  }
  try {
    const dbRef = ref(database);
    const snapshot = await get(child(dbRef, `years/${year}/subjects`));

    if (!snapshot.exists()) {
      subjectsList.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px 20px;opacity:0.6;">⚠️ لا توجد مواد في هذه السنة</div>`;
      finishLoading();
      return;
    }

    const data = snapshot.val();
    let subjectNames = [];
    if (Array.isArray(data)) {
      subjectNames = data.map(s => s.subject_name || s.name || s).filter(Boolean);
    } else {
      subjectNames = Object.keys(data);
    }

    subjectsList.innerHTML = '';

    if (subjectNames.length === 0) {
      subjectsList.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px 20px;opacity:0.6;">⚠️ لا توجد مواد</div>`;
      finishLoading();
      return;
    }

    subjectNames.sort().forEach((sub, index) => {
      const card = document.createElement('div');
      card.className = 'subject-card';
      card.style.animationDelay = (index * 0.08) + 's';

      // Fallback
      const fallback = document.createElement('div');
      fallback.className = 'subject-fallback';
      fallback.textContent = '📘';
      card.appendChild(fallback);

      // الصورة من فولدر /subject/
      const img = document.createElement('img');
      img.className = 'subject-image';
      img.alt = sub;
      img.loading = 'lazy';
      img.decoding = 'async';

      const cleanName = sub.trim();
      const attempts = [
        `/subject/${cleanName}.jpg`,
        `/subject/${cleanName}.png`,
        `/subject/${cleanName}.jpeg`,
        `/subject/${cleanName}.webp`,
        `/subject/${cleanName.replace(/\s+/g, '_')}.jpg`,
        `/subject/${cleanName.replace(/\s+/g, '-')}.jpg`
      ];
      let attemptIndex = 0;

      img.onload = () => {
        img.classList.add('loaded');
        fallback.style.opacity = '0';
      };

      img.onerror = () => {
        attemptIndex++;
        if (attemptIndex < attempts.length) {
          img.src = attempts[attemptIndex];
        } else {
          img.style.display = 'none';
        }
      };

      img.src = attempts[0];
      card.appendChild(img);

      // اسم المادة
      const label = document.createElement('div');
      label.className = 'subject-label';
      label.textContent = sub;
      card.appendChild(label);

      // عند الضغط
      card.addEventListener('click', (e) => {
        vibrate(15);
        createRipple(e, card);
        setTimeout(() => {
          window.location.href = `teachers.html?year=${encodeURIComponent(year)}&subject=${encodeURIComponent(sub)}`;
        }, 150);
      });

      subjectsList.appendChild(card);
    });

    finishLoading();

  } catch (err) {
    console.error(err);
    subjectsList.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:40px 20px;color:#ff3b30;">❌ حدث خطأ أثناء التحميل</div>`;
    finishLoading();
  }
}
loadSubjects();

// تبديل الوضع
function toggleTheme() {
  const isDark = document.body.classList.contains('dark-mode');
  if (isDark) {
    document.body.classList.remove('dark-mode');
    document.body.classList.add('light-mode');
    darkToggle.classList.remove('active');
    localStorage.setItem('theme', 'light');
  } else {
    document.body.classList.remove('light-mode');
    document.body.classList.add('dark-mode');
    darkToggle.classList.add('active');
    localStorage.setItem('theme', 'dark');
  }
  vibrate(10);
}

// ✨ الوضع الافتراضي = داكن
const savedTheme = localStorage.getItem('theme') || 'dark';
if (savedTheme === 'dark') {
  document.body.classList.add('dark-mode');
  darkToggle.classList.add('active');
} else {
  document.body.classList.add('light-mode');
}
darkToggle.addEventListener('click', toggleTheme);

// الأزرار
backBtn.addEventListener('click', () => {
  vibrate(10);
  window.location.href = 'index.html';
});

shareBtn.addEventListener('click', async () => {
  vibrate(10);
  if (navigator.share) {
    try {
      await navigator.share({
        title: 'منصة THE BEST',
        text: 'منصة تعليمية متكاملة',
        url: window.location.href
      });
    } catch {
      showToast('❌ تم إلغاء المشاركة');
    }
  } else {
    showToast('المشاركة غير مدعومة');
  }
});

notifyBtn.addEventListener('click', () => {
  vibrate(10);
  showToast('🔔 الإشعارات ستُفعل قريباً!');
});
</script>
