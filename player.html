<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>تشغيل الفيديو - منصة THE BEST</title>

<link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');

  * {
    box-sizing: border-box;
  }

  body {
    font-family: 'Cairo', sans-serif;
    background: radial-gradient(circle at top, #0a0a0a, #000);
    color: #fff;
    margin: 0;
    text-align: center;
    overflow-x: hidden;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;

  .title {
    color: #ffd700;

  .back {
    font-size: 22px;
    cursor: pointer;
    color: #ffd700;
    transition: transform 0.3s;
    user-select: none;
    border: 0;
    background: transparent;
  }

  .back:hover {
    transform: translateX(-5px);
  }

  #player {
    display: block;
    max-width: 950px;
    width: 100%;
    height: 60vh;
    min-height: 240px;
    border: 0;
    border-radius: 18px;
    margin: 25px auto;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
    background: #000;
  }

  /* حاوية مشغل Bunny */
  .bunny-player-wrapper {
    position: relative;
    width: 100%;
    max-width: 950px;
    margin: 25px auto;
    overflow: hidden;
    border-radius: 18px;

</head>

<body>

<div class="topbar">
  <button class="back" onclick="history.back()" aria-label="رجوع">⬅</button>
  <div class="title">THE BEST 🎬</div>
  <div style="width:25px"></div>
</div>

<video id="player" playsinline controls poster="poster.jpg" hidden></video>

<!-- مشغل Bunny مع لوجو المنصة -->
<div class="bunny-player-wrapper" id="bunnyWrapper" hidden>
  <iframe
    id="bunnyFrame"
    title="Bunny Stream Video"
    allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture; fullscreen"
    allowfullscreen
    loading="eager">
  </iframe>

  <div class="the-best-watermark">THE BEST</div>
</div>

<div id="hint">💡 استخدم أزرار المشغّل للتحكم في الفيديو.</div>
<div id="error" class="error-msg" hidden></div>

<script src="https://cdn.plyr.io/3.7.8/plyr.polyfilled.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
(async function () {
  const videoElement = document.getElementById('player');
  const bunnyFrame = document.getElementById('bunnyFrame');
  const bunnyWrapper = document.getElementById('bunnyWrapper');
  const errorElement = document.getElementById('error');
  const hint = document.getElementById('hint');

  const videoTitle =
    localStorage.getItem('video_title') || 'Lecture Video';

  const savedSources = localStorage.getItem('video_sources');

  function showError(message) {
    errorElement.textContent = message;
    errorElement.hidden = false;
  }

  function getSource(item) {
    if (typeof item === 'string') {
      return item.trim();
    }

    if (item && typeof item === 'object') {
      const source =
        item.stream_url ||
        item.src ||
        item.url ||
        item.videoUrl ||
        item.video_url ||
        item.link ||
        '';

      return typeof source === 'string' ? source.trim() : '';
    }

    return '';
  }

  function getBunnyEmbedUrl(source) {
    try {
      const url = new URL(source.trim());

      if (url.protocol !== 'https:') return null;

      const allowedHosts = [
        'player.mediadelivery.net',
        'iframe.mediadelivery.net'
      ];

      if (!allowedHosts.includes(url.hostname.toLowerCase())) {
        return null;
      }

      const match = url.pathname.match(
        /^\/(play|embed)\/(\d+)\/([a-f0-9-]+)\/?$/i
      );

      if (!match) return null;

      const libraryId = match[2];
      const videoId = match[3];

      return (
        'https://player.mediadelivery.net/embed/' +
        libraryId + '/' + videoId
      );
    } catch (_) {
      return null;
    }
  }

  function initializeHls(source) {
    videoElement.hidden = false;
    bunnyWrapper.hidden = true;

    const player = new Plyr(videoElement, {
      title: videoTitle,
      controls: [
        'play-large',
        'play',
        'rewind',
        'fast-forward',
        'progress',
        'current-time',
        'duration',
        'mute',
        'volume',
        'settings',
        'fullscreen'
      ],
      settings: ['quality', 'speed', 'loop'],
      rewindTime: 10,
      forwardTime: 10
    });

    if (Hls.isSupported()) {
      const hls = new Hls();

      hls.loadSource(source);
      hls.attachMedia(videoElement);

      hls.on(Hls.Events.ERROR, function (_, data) {
        if (data.fatal) {
          showError(
            'تعذر تشغيل الفيديو. تحقق من الرابط وصلاحيات الوصول.'
          );
        }
      });
    } else if (
      videoElement.canPlayType('application/vnd.apple.mpegurl')
    ) {
      videoElement.src = source;
    } else {
      showError('المتصفح لا يدعم تشغيل هذا النوع من الفيديو.');
    }

    player.on('play', async function () {
      try {
        if (!player.fullscreen.active) {
          await player.fullscreen.enter();
        }

        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
        }
      } catch (_) {
        // بعض المتصفحات لا تسمح بالتدوير أو ملء الشاشة تلقائيًا.
      }
    });

    player.on('ended', function () {
      alert('🎬 انتهى الفيديو');
    });
  }

  if (!savedSources) {
    showError(
      'لم يتم تحديد رابط الفيديو. ارجع للصفحة السابقة واختَر الفيديو.'
    );
    return;
  }

  let videoData;

  try {
    videoData = JSON.parse(savedSources);
  } catch (error) {
    showError('تعذر قراءة بيانات الفيديو المحفوظة.');
    console.error('VIDEO DATA ERROR:', error);
    return;
  }

  const sourceItems = Array.isArray(videoData)
    ? videoData
    : [videoData];

  const firstItem = sourceItems.find(function (item) {
    return Boolean(getSource(item));
  });

  const firstSource = getSource(firstItem);

  console.log('VIDEO DATA:', videoData);
  console.log('VIDEO SOURCE:', firstSource);

  if (!firstSource) {
    showError(
      'رابط الفيديو غير موجود داخل البيانات المحفوظة. تأكد من اسم حقل الرابط.'
    );
    return;
  }

  // الحالة الأولى: رابط مشغّل Bunny Stream
  const bunnyUrl = getBunnyEmbedUrl(firstSource);

  if (bunnyUrl) {
    videoElement.hidden = true;
    bunnyWrapper.hidden = false;
    bunnyFrame.src = bunnyUrl;

    hint.textContent =
      '💡 استخدم أدوات التحكم داخل مشغّل الفيديو.';

    bunnyFrame.addEventListener('error', function () {
      showError('تعذر تحميل مشغّل Bunny Stream.');
    });

    return;
  }

  // الحالة الثانية: رابط HLS مباشر
  if (/\.m3u8(?:$|\?)/i.test(firstSource)) {
    initializeHls(firstSource);
    return;
  }

  // روابط غير مدعومة
  showError(
    'رابط الفيديو غير مدعوم. الرابط المستلم: ' +
    firstSource
  );

})();

setTimeout(function () {
  const hint = document.getElementById('hint');

  if (hint) {
    hint.style.display = 'none';
  }
}, 7000);
</script>

</body>
</html>
