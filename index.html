<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>السنوات - منصة THE BEST</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* ===== RESET & ROOT (نفسه تماماً) ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --gold: #d4a017;
      --gold-light: #f5d742;
      --shadow: 0 8px 30px rgba(0,0,0,0.08);
      --radius: 44px;
      --topbar-bg: rgba(255,255,255,0.92);
    }
    body.light-mode {
      --bg: #f2f2f7;
      --card-bg: #ffffff;
      --text: #1c1c1e;
      --topbar-bg: rgba(255,255,255,0.92);
    }
    body.dark-mode {
      --bg: #0e0e0e;
      --card-bg: #1c1c1e;
      --text: #f5f5f7;
      --topbar-bg: rgba(30,30,30,0.92);
      --shadow: 0 8px 30px rgba(0,0,0,0.5);
    }
    body {
      font-family: 'Cairo', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      height: 100dvh;          /* ← ديناميكي حسب الشاشة */
      overflow: hidden;        /* ← منع تمرير الصفحة */
      transition: background 0.3s, color 0.3s;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    /* ===== حاوية التطبيق (تملأ الشاشة) ===== */
    .app-container {
      max-width: 430px;
      width: 100%;
      height: 100dvh;          /* ← نفس ارتفاع الشاشة */
      background: var(--bg);
      transition: background 0.3s;
      display: flex;
      flex-direction: column;  /* ← الأهم: ترتيب رأسي */
      position: relative;
    }
    /* ===== شريط الحالة ===== */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px 6px;   /* نفس المسافات بس ضبطناها */
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      opacity: 0.8;
      letter-spacing: 0.2px;
      min-height: 40px;
      flex-shrink: 0;          /* ← يمنع الانكماش */
      background: var(--bg);
      transition: background 0.3s;
    }
    .status-left, .status-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-right span { font-size: 15px; }
    .status-battery {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .battery-level { font-size: 14px; font-weight: 700; }
    /* ===== شريط التنقل ===== */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px 16px;   /* نفس الضبط */
      border-bottom: 1px solid rgba(60,60,67,0.08);
      background: var(--bg);
      transition: background 0.3s;
      flex-shrink: 0;           /* ← يمنع الانكماش */
    }
    .topbar .brand {
      font-size: 20px;
      font-weight: 800;
      background: linear-gradient(135deg, #d4a017, #f5d742);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.5px;
    }
    .topbar .actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .topbar .actions button, .topbar .actions a {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 22px;
      color: var(--text);
      opacity: 0.8;
      transition: 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(0,0,0,0.04);
      text-decoration: none;
    }
    .topbar .actions button:hover, .topbar .actions a:hover {
      opacity: 1;
      background: rgba(0,0,0,0.08);
    }
    /* ===== مفتاح الوضع ===== */
    .toggle-dark {
      width: 52px;
      height: 30px;
      background: #e9e9ed;
      border-radius: 30px;
      position: relative;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }
    .toggle-dark.active { background: #34c759; }
    .toggle-dark .thumb {
      width: 26px;
      height: 26px;
      background: white;
      border-radius: 50%;
      position: absolute;
      top: 2px;
      left: 2px;
      transition: 0.3s cubic-bezier(0.3, 1.2, 0.4, 1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }
    .toggle-dark.active .thumb { transform: translateX(22px); }
    /* ===== حاوية المحتوى القابلة للتمرير ===== */
    .scroll-content {
      flex: 1;                /* ← ياخد باقي المساحة */
      overflow-y: auto;       /* ← التمرير هنا بس */
      padding: 0 20px 20px;   /* نفس الهوامش بس من غير padding-top */
      -webkit-overflow-scrolling: touch;
      background: var(--bg);
      transition: background 0.3s;
    }
    /* تنسيق شريط التمرير (اختياري) */
    .scroll-content::-webkit-scrollbar { width: 4px; }
    .scroll-content::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
    /* ===== العنوان الرئيسي ===== */
    .page-title {
      font-size: 32px;
      font-weight: 800;
      margin: 20px 0 28px;     /* نفس المسافات بس من غير padding */
      letter-spacing: -0.5px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-title span { background: var(--gold); color: white; font-size: 18px; padding: 4px 14px; border-radius: 40px; font-weight: 600; }
    /* ===== شبكة السنوات ===== */
    .years-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
      padding-bottom: 20px;   /* مسافة تحت الشبكة */
    }
    .year-card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 22px 12px;
      box-shadow: var(--shadow);
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.4, 1);
      cursor: pointer;
      text-align: center;
      font-weight: 700;
      font-size: 1.2rem;
      color: var(--text);
      border: 1px solid rgba(255,215,0,0.05);
      user-select: none;
      position: relative;
      overflow: hidden;
    }
    .year-card:active {
      transform: scale(0.94);
      box-shadow: 0 0 0 2px var(--gold), 0 4px 16px rgba(212,160,23,0.3);
    }
    .year-card .year-icon {
      font-size: 2.4rem;
      display: block;
      margin-bottom: 8px;
    }
    .year-card .year-label {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .year-card.loading {
      grid-column: 1 / -1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
      background: transparent;
      box-shadow: none;
      border: none;
      font-weight: 400;
      color: var(--text);
      opacity: 0.6;
      cursor: default;
      padding: 40px 0;
    }
    .year-card.loading::after {
      content: "";
      width: 28px;
      height: 28px;
      border: 3px solid var(--gold);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* ===== زر البروفايل العائم (نفسه) ===== */
    .profile-float {
      position: fixed;
      bottom: 30px;
      left: 30px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 2px solid var(--gold);
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: 0.3s;
      z-index: 999;
      text-decoration: none;
      color: var(--text);
      font-size: 28px;
    }
    .profile-float:hover { transform: scale(1.05); background: var(--gold); color: white; border-color: white; }
    /* ===== Toast ===== */
    .custom-toast {
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
      color: white;
      padding: 14px 28px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 15px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.3);
      z-index: 9999;
      animation: toastIn 0.4s ease, toastOut 0.4s ease 2.8s forwards;
      max-width: 85%;
      white-space: nowrap;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(30px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes toastOut { to { opacity: 0; transform: translateX(-50%) translateY(30px); } }
    /* ===== استجابة ===== */
    @media (max-width: 480px) {
      .scroll-content { padding: 0 16px 16px; }
      .page-title { font-size: 26px; }
      .years-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
      .year-card { padding: 18px 10px; font-size: 1rem; }
      .profile-float { width: 50px; height: 50px; bottom: 20px; left: 20px; font-size: 22px; }
      .status-bar { font-size: 12px; padding: 8px 16px 4px; }
      .topbar { padding: 8px 16px 12px; }
    }
  </style>
</head>
<body>
<div class="app-container" id="app">

  <!-- ===== شريط الحالة الحقيقي ===== -->
  <div class="status-bar">
    <div class="status-left">
      <span id="statusTime">00:00</span>
    </div>
    <div class="status-right">
      <span id="statusNetwork">📶</span>
      <span class="status-battery">
        <span id="batteryIcon">🔋</span>
        <span class="battery-level" id="batteryLevel">--%</span>
      </span>
    </div>
  </div>

  <!-- شريط التنقل -->
  <div class="topbar">
    <div class="brand">THE BEST</div>
    <div class="actions">
      <div class="toggle-dark" id="darkToggle">
        <div class="thumb"></div>
      </div>
      <a href="https://wa.me/" target="_blank" aria-label="واتساب">💬</a>
      <button id="shareBtn" aria-label="مشاركة">📤</button>
      <button id="notifyBtn" aria-label="إشعارات">🔔</button>
    </div>
  </div>

  <!-- ===== المحتوى القابل للتمرير ===== -->
  <div class="scroll-content">
    <!-- العنوان -->
    <div class="page-title">
      📚 السنوات <span>اختر</span>
    </div>

    <!-- شبكة السنوات -->
    <div class="years-grid" id="yearsList">
      <div class="year-card loading">جاري التحميل...</div>
    </div>
  </div>

  <!-- زر البروفايل العائم -->
  <a href="profile.html" class="profile-float">👤</a>
</div>

<!-- ===== نفس السكربتات بالضبط (لم نتغير) ===== -->
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
    "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
  }
}
</script>
<script type="module">
import { initializeApp } from 'firebase/app';
import { getDatabase, ref, get, child } from 'firebase/database';

// ===== Firebase Config (نفسه) =====
const firebaseConfig = {
  apiKey: "AIzaSyB0p0us6BuzD2ngzjhRnmUIhlOcBeRp0vQ",
  authDomain: "tok-tak-d6e17.firebaseapp.com",
  databaseURL: "https://tok-tak-d6e17-default-rtdb.firebaseio.com",
  projectId: "tok-tak-d6e17",
  storageBucket: "tok-tak-d6e17.appspot.com",
  messagingSenderId: "547062578826",
  appId: "1:547062578826:web:aa285cf798341be07cb773",
  measurementId: "G-7EMKEQKPVV"
};

const app = initializeApp(firebaseConfig);
const database = getDatabase(app);

// ===== عناصر DOM =====
const yearsList = document.getElementById('yearsList');
const darkToggle = document.getElementById('darkToggle');
const shareBtn = document.getElementById('shareBtn');
const notifyBtn = document.getElementById('notifyBtn');

// عناصر شريط الحالة
const statusTime = document.getElementById('statusTime');
const statusNetwork = document.getElementById('statusNetwork');
const batteryIcon = document.getElementById('batteryIcon');
const batteryLevel = document.getElementById('batteryLevel');

// ===== 1. الوقت الحقيقي (كل ثانية) =====
function updateTime() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2, '0');
  const m = String(now.getMinutes()).padStart(2, '0');
  statusTime.textContent = `${h}:${m}`;
}
updateTime();
setInterval(updateTime, 1000);

// ===== 2. الشبكة الحقيقية (نوع الاتصال) =====
function updateNetwork() {
  const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if (!connection) {
    statusNetwork.textContent = '📶';
    return;
  }
  const type = connection.effectiveType;
  const downlink = connection.downlink;
  
  let icon = '📶';
  let label = '';
  switch(type) {
    case 'wifi': icon = '📶'; label = 'Wi-Fi'; break;
    case '4g': icon = '📶'; label = '4G'; break;
    case '5g': icon = '📶'; label = '5G'; break;
    case '3g': icon = '📶'; label = '3G'; break;
    case '2g': icon = '📶'; label = '2G'; break;
    default: icon = '📶'; label = type || 'شبكة';
  }
  statusNetwork.textContent = icon; 
  statusNetwork.title = label + (downlink ? ` (${downlink} Mbps)` : '');
}
updateNetwork();
if (navigator.connection) {
  navigator.connection.addEventListener('change', updateNetwork);
}

// ===== 3. البطارية الحقيقية =====
async function updateBattery() {
  try {
    if (!navigator.getBattery) {
      batteryLevel.textContent = '--%';
      batteryIcon.textContent = '🔋';
      return;
    }
    const battery = await navigator.getBattery();
    const level = Math.round(battery.level * 100);
    batteryLevel.textContent = `${level}%`;
    
    if (battery.charging) {
      batteryIcon.textContent = '⚡️';
    } else {
      if (level > 60) batteryIcon.textContent = '🔋';
      else if (level > 20) batteryIcon.textContent = '🪫';
      else batteryIcon.textContent = '🪫';
    }
    battery.addEventListener('levelchange', updateBattery);
    battery.addEventListener('chargingchange', updateBattery);
  } catch (err) {
    console.warn('Battery API not supported:', err);
    batteryLevel.textContent = '--%';
    batteryIcon.textContent = '🔋';
  }
}
updateBattery();

// ===== Toast =====
function showToast(msg) {
  const existing = document.querySelector('.custom-toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'custom-toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => { if (toast.parentNode) toast.remove(); }, 3000);
}

// ===== تحميل السنوات =====
async function loadYears() {
  try {
    const dbRef = ref(database);
    const snapshot = await get(child(dbRef, 'years'));
    if (!snapshot.exists()) {
      yearsList.innerHTML = `<div class="year-card" style="grid-column:1/-1;background:transparent;box-shadow:none;cursor:default;">⚠️ لا توجد سنوات، أضفها من لوحة التحكم</div>`;
      return;
    }
    const data = snapshot.val();
    const yearNames = Object.keys(data).sort();
    yearsList.innerHTML = '';
    if (yearNames.length === 0) {
      yearsList.innerHTML = `<div class="year-card" style="grid-column:1/-1;background:transparent;box-shadow:none;cursor:default;">⚠️ لا توجد سنوات</div>`;
      return;
    }
    yearNames.forEach(year => {
      const card = document.createElement('div');
      card.className = 'year-card';
      card.innerHTML = `<span class="year-icon">📖</span><span class="year-label">${year}</span>`;
      card.addEventListener('click', () => {
        window.location.href = `subjects.html?year=${encodeURIComponent(year)}`;
      });
      yearsList.appendChild(card);
    });
  } catch (err) {
    console.error(err);
    yearsList.innerHTML = `<div class="year-card" style="grid-column:1/-1;background:transparent;box-shadow:none;cursor:default;color:#ff3b30;">❌ فشل تحميل البيانات</div>`;
  }
}
loadYears();

// ===== تبديل الوضع (داكن / فاتح) =====
function toggleTheme() {
  const isDark = document.body.classList.contains('dark-mode');
  if (isDark) {
    document.body.classList.remove('dark-mode');
    document.body.classList.add('light-mode');
    darkToggle.classList.remove('active');
    localStorage.setItem('theme', 'light');
  } else {
    document.body.classList.remove('light-mode');
    document.body.classList.add('dark-mode');
    darkToggle.classList.add('active');
    localStorage.setItem('theme', 'dark');
  }
}
const savedTheme = localStorage.getItem('theme') || 'light';
if (savedTheme === 'dark') {
  document.body.classList.add('dark-mode');
  darkToggle.classList.add('active');
} else {
  document.body.classList.add('light-mode');
}
darkToggle.addEventListener('click', toggleTheme);

// ===== مشاركة =====
shareBtn.addEventListener('click', async () => {
  if (navigator.share) {
    try {
      await navigator.share({
        title: 'منصة THE BEST',
        text: 'منصة تعليمية متكاملة',
        url: window.location.href
      });
    } catch {
      showToast('❌ تم إلغاء المشاركة');
    }
  } else {
    showToast('المشاركة غير مدعومة');
  }
});

// ===== إشعارات =====
notifyBtn.addEventListener('click', () => {
  showToast('🔔 الإشعارات ستُفعل قريباً!');
});

// ===== تأثير إضافي على بطاقات السنوات =====
document.addEventListener('click', (e) => {
  const card = e.target.closest('.year-card');
  if (card && !card.classList.contains('loading')) {
    card.style.transition = 'background 0.15s';
    card.style.background = 'var(--gold)';
    card.style.color = 'white';
    setTimeout(() => {
      card.style.background = '';
      card.style.color = '';
    }, 200);
  }
});
</script>
  <script src="app.js"></script>
</body>
</html>
